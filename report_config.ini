# ==========================================================================
# Calibration report / certificate settings for the Advantest R6161 tool.
# Edit these to appear on the generated ISO/IEC 17025-style certificates.
# Fields left blank are shown as placeholders on the certificate.
# ==========================================================================

[laboratory]
name          =
address       =
accreditation =

[customer]
name    =
address =

[uut]
# The instrument being calibrated. Its description, model and firmware revision
# are read from the instrument itself (*IDN?) and are not settable here; the
# R6161 reports neither a serial number nor an option list, so those two are
# asked at the start of a performance verification. Whatever is put here is
# offered as the answer, so a bench that calibrates the same R6161 every time
# can fill them in once and press Enter thereafter.
#
# The serial number is on the rear-panel label.
serial  =
# Fitted options, as they should read on the certificate. Leave blank for none;
# the certificate then shows "-".
options =

[personnel]
operator =
approver =

[conditions]
# Recorded on the certificate. The R6161 specification is quoted for
# 23 +/-5 degrees C and 70 %RH or less; update to the actual bench conditions.
temperature_c = 23.0
humidity_pct  = 45

[report]
# Where certificates are written (relative to this folder unless absolute).
output_dir = reports
# Certificate number prefix; a timestamp is appended automatically.
cert_prefix = R6161-CAL
# Report languages produced by default, comma separated. Any code with a
# catalog in lang/report/ may be used.
languages = en
# Which published accuracy table verification is graded against.
# One of: 1day | 90day | 180day   (Operation Manual section 8.1, table 2)
interval = 90day
