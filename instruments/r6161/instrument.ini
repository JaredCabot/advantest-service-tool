# ==========================================================================
# Instrument plugin manifest - Advantest R6161 DC Voltage/Current Generator
#
# The core reads this file to list the instrument, match it against a bus scan
# and decide which menu items to offer. It imports none of the Python modules
# below until this instrument is actually selected, so a plugin whose code is
# broken costs its own menu entry and nothing else.
#
# To add an instrument, copy this folder, rewrite the four modules, and edit
# this file. Nothing in the core is edited and nothing in the core knows the
# name of any particular instrument.
# ==========================================================================

[instrument]
# Short, lowercase, unique. Names the saved-run files and the settings section,
# so changing it later orphans both.
key = r6161

# What the operator sees in the instrument menu and on the certificate.
name = R6161 DC Voltage/Current Generator
manufacturer = Advantest

# Models this plugin covers. One plugin may serve several closely related
# instruments where the differences are confined to its own tables.
models = R6161

# The item-under-test description on the certificate. The manufacturer is
# prepended by the driver from *IDN?, so it is not repeated here.
description = Voltage Current Source

# Substrings looked for in a *IDN? response, case-insensitively, to recognise
# this instrument on the bus. Defaults to the model list when blank.
identity_match = R6161

# Where the instrument usually lives, offered as the default when a scan finds
# nothing.
default_resource = GPIB0::4::INSTR

[capabilities]
# What this plugin can actually do. The menu offers exactly this and no more:
# there is no half-supported state in which an item exists and fails when it is
# chosen. An instrument whose calibration commands are undocumented would set
# adjust = no and still be fully useful for verification.
verify = yes
adjust = yes
calram = yes

[modules]
# Module names inside this folder, without the .py. They may import each other
# by these plain names; the folder is put on the path when the plugin loads.
driver = driver
spec   = spec
perf   = perf_plan
adjust = adjust_plan

# The class the core opens the instrument with. Optional: with this blank the
# core finds the only class in the driver module carrying the required methods,
# and says so if that is ambiguous.
driver_class = R6161

[timing]
# Optional. Values here are pushed into the driver module when the plugin
# loads, overriding the module's own -- which are the instrument's measured
# defaults and are what applies when this section is empty. A value the module
# does not define, or that will not parse as a number, is reported and ignored
# rather than quietly substituted: a timing change belongs in the record of a
# run that produces a traceable certificate.
#
# See the driver module for what each one is and what measurement it rests on.
# SETTLE_S       =
# SETTLE_HV_S    =
# SETTLE_100MA_S =
# THERMAL_WAIT_S =

[notes]
# Free text shown under Instrument information. Anything an operator of THIS
# instrument needs and an operator of another one does not.
text =
    The rear-panel EXT CAL switch gates every query: in ENABLE the instrument
    answers nothing, which is why a healthy R6161 can look dead. Verification
    needs it in DISABLE, adjustment in ENABLE.
    The calibration commands this plugin uses appear in no Advantest manual.
    They were recovered from firmware A05 by disassembly and confirmed on a
    working instrument; see the Technical Reference.
