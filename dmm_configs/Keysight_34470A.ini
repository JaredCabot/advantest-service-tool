# ==========================================================================
# DMM configuration - Keysight 34470A Truevolt  (SCPI)
#
# 7.5 digit. Split out from the combined 34460A/34461A/34465A/34470A config,
# because the other three members of that family are 6.5 digit and are not
# adequate to certify an R6161: their published DC voltage accuracy at 10 V
# is comparable to, or worse than, the generator's own.
#
# TEST UNCERTAINTY RATIO - READ THIS BEFORE CERTIFYING WITH IT. The R6161's
# tightest specification is 32 ppm at 10 V and 100 V (90 day: 25 ppm of
# setting plus 7 ppm of range). The 34470A's published DC voltage accuracy at
# 10 V is of the order of 17 to 21 ppm depending on the interval claimed,
# which is a ratio of roughly 1.5:1 to 2:1. That is below the 4:1 ratio
# normally expected of a reference standard, so this meter is retained for
# functional checks and as-found readings rather than for issuing a
# calibration certificate. Every other meter in this folder is 8.5 digit and
# reaches 3:1 or better; prefer one of those if you have it.
#
# The command set is identical across the whole Truevolt family, so this file
# also drives a 34460A, 34461A or 34465A if you change the model and match
# strings - accepting the ratio caveat above, which is worse still for those.
#
# CONFIDENCE: high for the command set (standard Keysight SCPI, unchanged
# from the combined config it was split from). The accuracy figures quoted
# above are from the published data sheet and are indicative; confirm against
# the specification for your interval before relying on them.
#
# Sources:
#   https://www.keysight.com/us/en/support/34470A/digital-multimeter-7-5-digit-truevolt-dmm.html
# ==========================================================================

[dmm]
name   = Keysight 34470A Truevolt
model  = 34470A
digits = 7.5

[identify]
query = *IDN?
match = 34470A

[connection]
interface = GPIB
resource  =
address   = 22
gpib_template = GPIB0::{addr}::INSTR
lan_template  = TCPIP0::{addr}::inst0::INSTR
usb_template  = {addr}
read_termination  = \n
write_termination = \n
timeout_ms  = 30000
assert_ren  = false
init =

[dcv]
# CONF:VOLT:DC on the Truevolt family accepts the literal word AUTO in the
# range parameter as well as a numeric range, so no separate setup_auto block
# is needed here. NPLC is set as a second command because CONF alone resets
# it to the instrument's own default integration time.
setup =
    CONF:VOLT:DC {range}
    VOLT:DC:NPLC {nplc}
setup_dwell_s     = 0.4
drain_after_setup = false
# Integration capability, declared so the tool reduces a request the meter
# cannot honour instead of sending a value it would refuse.
nplc_values = 0.001,0.002,0.006,0.02,0.06,0.2,1,10,100
nplc = 100
trigger  =
query    = READ?
settle_s = 0.5
drain_before_read = false

[dci]
setup =
    CONF:CURR:DC {range}
    CURR:DC:NPLC {nplc}
setup_dwell_s     = 0.4
drain_after_setup = false
nplc_values = 0.001,0.002,0.006,0.02,0.06,0.2,1,10,100
nplc = 10
trigger  =
query    = READ?
settle_s = 0.5
drain_before_read = false

[ohmf]
# 4-wire ohms is used to measure the standard resistors, so it is set up for
# accuracy rather than speed: offset compensation on, a settling delay before
# the integration, and a long integration. Offset compensation is the important
# one -- it reads twice, with and without the test current, and subtracts, which
# removes the thermal EMF that otherwise dominates a 10 ohm measurement.
setup =
    CONF:FRES {range}
    FRES:NPLC {nplc}
    FRES:OCOM ON
    TRIG:DEL 1
setup_dwell_s     = 0.4
drain_after_setup = false
nplc_values = 0.001,0.002,0.006,0.02,0.06,0.2,1,10,100
nplc = 10
trigger  =
query    = READ?
settle_s = 0.5
drain_before_read = false
