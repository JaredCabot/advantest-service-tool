# ==========================================================================
# DMM configuration - Keysight / Agilent / HP 34420A NanoVolt / Micro-Ohm Meter
#
# 7.5 digit. The best available choice for the R6161's Divider ranges: its
# 1 mV and 10 mV ranges and sub-nanovolt resolution resolve a 10 mV full scale
# far better than a general-purpose 6.5 digit meter can.
#
# TWO IMPORTANT LIMITATIONS, both encoded below:
#   * There is NO DC current function, so there is no [dci] section. The tool
#     will report this when the meter is selected and the current group of the
#     R6161 procedure cannot be run with it.
#   * The highest DC voltage range is 100 V. max_input stops the tool applying
#     the R6161's 1000 V range to its terminals.
#
# CONFIDENCE: high - command syntax, NPLC set, ranges and default address all
# taken from the HP 34420A User's Guide (part number 34420-90001).
#
# Sources:
#   https://xdevs.com/doc/HP_Agilent_Keysight/34420A/HP_34420A_UM_Ed1.pdf
#   https://www.keysight.com/us/en/assets/7018-06838/data-sheets/5968-0161.pdf
# ==========================================================================

[dmm]
name   = Keysight/Agilent/HP 34420A NanoVolt Meter
model  = 34420A
digits = 7.5

[identify]
query = *IDN?
match = 34420A

[connection]
interface = GPIB
resource  =
# The User's Guide gives the factory HP-IB address as 22 (settable 0 to 30).
address   = 22
gpib_template = GPIB0::{addr}::INSTR
lan_template  = TCPIP0::{addr}::inst0::INSTR
usb_template  = {addr}
read_termination  = \n
write_termination = \n
timeout_ms  = 60000
assert_ren  = false
# Clear the status registers without disturbing the front-panel setup. *RST is
# deliberately not sent: it would drop the analogue filter and channel
# selection the operator may have chosen.
init =
    *CLS

[dcv]
# CONFigure sets the function and range together. The range parameter is
# documented as {<range>|MIN|MAX|DEF} - the literal word AUTO is not among
# them - so autoranging is expressed by its own block below.
#
# ROUT:TERM CHAN1 selects the front (Channel 1) input pair, which is the one
# with the 100 V range; Channel 2 stops at 10 V.
#
# The analogue low-pass filter is left as the operator set it. Turning it on
# helps on the millivolt ranges and costs settling time; the tool's own
# settling allowance is generous enough either way.
setup =
    ROUT:TERM CHAN1
    CONF:VOLT:DC {range}
    SENS:VOLT:DC:NPLC {nplc}
setup_auto =
    ROUT:TERM CHAN1
    CONF:VOLT:DC
    SENS:VOLT:DC:RANG:AUTO ON
    SENS:VOLT:DC:NPLC {nplc}
setup_dwell_s     = 0.4
drain_after_setup = false
# Documented set: {0.02|0.2|1|2|10|20|100|200}. Unusually generous at the top
# end - 200 power-line cycles is four seconds of integration at 50 Hz.
nplc_values = 0.02,0.2,1,2,10,20,100,200
nplc = 20
# Channel 1 ranges are 1 mV, 10 mV, 100 mV, 1 V, 10 V, 100 V.
max_input = 100
trigger  =
query    = READ?
settle_s = 0.3
drain_before_read = false

# No [dci] section: the 34420A measures voltage, resistance and temperature
# only. This is a deliberate omission, not an oversight.

[ohmf]
# 4-wire ohms is used to measure the standard resistors, so it is set up for
# accuracy rather than speed: offset compensation on, a settling delay before
# the integration, and a long integration. Offset compensation is the important
# one -- it reads twice, with and without the test current, and subtracts, which
# removes the thermal EMF that otherwise dominates a 10 ohm measurement.
# 4-wire resistance. Offset compensation is worth having when measuring a
# standard resistor, as it removes thermal EMF in the leads - the same effect
# that the R6161's own Divider terminals are so sensitive to.
setup =
    CONF:FRES {range}
    SENS:FRES:NPLC {nplc}
    SENS:FRES:OCOM ON
    TRIG:DEL 1
setup_auto =
    CONF:FRES
    SENS:FRES:RANG:AUTO ON
    SENS:FRES:NPLC {nplc}
    SENS:FRES:OCOM ON
    TRIG:DEL 1
setup_dwell_s     = 0.4
drain_after_setup = false
nplc_values = 0.02,0.2,1,2,10,20,100,200
nplc = 200
trigger  =
query    = READ?
settle_s = 0.3
drain_before_read = false
