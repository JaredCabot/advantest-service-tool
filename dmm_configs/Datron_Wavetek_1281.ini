# ==========================================================================
# DMM configuration - Datron/Wavetek 1281 Precision Multifunction Calibrator
#                      Reference Multimeter (8.5-digit DMM mode)
#
# Pre-SCPI, English-mnemonic command language. This is the direct ancestor
# of the Fluke 8508A's (and hence the 8508A config in this folder) command
# set -- DCV/DCI/OHMS/TRUE_OHMS function verbs, RESLn resolution tokens,
# FAST_ON/FAST_OFF speed tokens, *TRG/RDG?/X? triggering -- but several
# details differ from the 8508A descendant and are called out below.
#
# COMMAND LANGUAGE NOTES:
#   * Range and every modifier (filter, resolution, speed, wire mode) are
#     sent as ONE comma-separated program message after the function verb,
#     e.g. "DCV 10,RESL8,FAST_OFF,TWR" -- this is the literal form the
#     manual itself uses ("DCV 10,FILT-ON,RESL7", Sec.5 p.5-31; "OHMS
#     10000,FWR,RESL8", p.5-36), so it is used verbatim here.
#   * AUTO is a literal value accepted directly in the Nrf (range) slot --
#     confirmed by the manual's own example "ACI AUTO,FILT40Hz" (p.5-44).
#     So a single setup block works for both a fixed range and AUTO; no
#     separate setup_auto block is needed (unlike the 8508A, whose manual
#     was read as requiring AUTO as a distinct token -- see that config).
#   * There is no NPLC concept. Integration time is fixed by a resolution
#     token (RESL4..RESL8 = 4.5..8.5 digits, function-dependent ceiling)
#     crossed with FAST_ON/FAST_OFF (Sec.5 pp.5-30/36/40/42, and the A-D
#     Mode/Power-Line-Cycles table on p.5-71). {nplc} is therefore never
#     used in this file; RESL8,FAST_OFF (DCV/OHMS) or RESL6,FAST_OFF (DCI,
#     whose ceiling is 6.5 digits) is used throughout for maximum accuracy,
#     matching each function's own power-on default resolution.
#   * TRG_SRCE INT is the power-on default (p.5-68): the instrument free-
#     runs on its own internal interval counter and IGNORES controller
#     *TRG/GET until "TRG_SRCE EXT" is sent, which "disables internal
#     triggers and enables three external trigger sources[:] ... rear panel
#     trigger socket, Controller-generated GET/*TRG commands, [and] Front
#     panel Sample key" (p.5-68). This is sent once at connect time below;
#     without it, X?/RDG? would read back whatever the free-running timer
#     produced instead of a reading taken to order.
#   * 4-wire resistance: unlike the 8508A's TRUE_OHMS (there documented as
#     unconditionally 4-wire), the 1281's TRUE_OHMS syntax diagram (p.5-40)
#     offers no TWR/FWR token at all, and its Power-On/Reset table shows
#     "Connection: TWR (two wire)" (p.5-41) -- so on THIS instrument True
#     Ohms is not usable as a general 4-wire function via a documented
#     command. Plain "OHMS {range},FWR,..." is used instead: the syntax
#     diagram for normal OHMS (p.5-36) explicitly lists FWR ("selects
#     4-wire Ohms") as a modifier, with the worked example "OHMS
#     10000,FWR,RESL8" given verbatim in the manual. OHMS covers 1 ohm to
#     20 Mohm (HI_OHMS takes over above that), which comfortably covers a
#     ~10 ohm current-limit standard resistor.
#
# CONFIDENCE: medium. Command syntax, range tables, RESL/FAST resolution
# model, FWR 4-wire modifier, TRG_SRCE/*TRG/X?/RDG? trigger model, the
# message terminator and *IDN? response layout are all taken directly from
# the manual (high confidence). Two things are NOT stated in Section 5 and
# are marked UNVERIFIED below: the factory-default GPIB address, and the
# *IDN? manufacturer/model text to expect on a real unit (the manual's own
# worked example response oddly prints "1271" in the model field -- see
# note in [identify] below).
#
# Sources:
#   Datron/Wavetek 1281 8.5 Digit Multimeter User Manual, Section 5
#   "Systems Application via the IEEE 488 Interface": Bus Addresses (p.5-2),
#   Addressing/Remote Operation (pp.5-6/5-7), Programming Guidance/message
#   terminator (pp.5-8/5-9), DC Voltage syntax (pp.5-30/5-31), Normal Ohms
#   syntax (pp.5-36/5-37), True Ohms syntax (pp.5-40/5-41), DC Current
#   syntax (pp.5-42/5-43), Triggers and Readings / TRG_SRCE / *TRG / X? /
#   RDG? (pp.5-68/5-69/5-74), A-D Mode & Power-Line-Cycle table (p.5-71),
#   Instrument I/D *IDN? (p.5-86), Appendix B Device Settings at Power On
#   (p.5-B1).
# ==========================================================================

[dmm]
name   = Datron/Wavetek 1281 Reference Multimeter
model  = 1281
digits = 8.5

[identify]
# *IDN? "will recall the instrument's manufacturer, model number, serial
# number and firmware level" (p.5-86), IEEE 488.2-conformant. The manual's
# own worked example response, given character-position by character-
# position, decodes to:
#   DATRON INSTRUMENTS,1271,456789-01.09,890144/00.00
# Note the second (model) field reads "1271", not "1281" -- almost
# certainly a documentation artifact carried over from the related 1271
# instrument's manual/example rather than what a real 1281 reports.
# UNVERIFIED -- confirm the actual *IDN? model field against a real unit
# before relying on an exact "1281" substring match; "DATRON" (the
# manufacturer field) is used below instead, since it is consistent
# regardless of that discrepancy.
query = *IDN?
match = DATRON

[connection]
interface = GPIB
resource  =
# UNVERIFIED -- the manual states only that "The instrument address can
# only be set manually; using the ADDRESS menu ... accessed via the STATUS
# and STATUS CONFIG menus" and that valid addresses are 0-30 ("Bus
# Addresses", p.5-2; "Setting the Bus Address", p.5-6); no factory-default
# address is given anywhere in Section 5. Read the actual address from
# STATUS > Config > Addr on the front panel and put it here.
address   = 1
gpib_template = GPIB0::{addr}::INSTR
lan_template  = TCPIP0::{addr}::inst0::INSTR
usb_template  = {addr}
# "The message terminator for the 1281 is the Hex number 0A, characterized
# in IEEE 488.2 as 'NL'. Alternatively, the 'End or Identify' (EOI) line can
# be set true with the last byte to be sent" (p.5-9) -- plain LF, no CR.
read_termination  = \n
write_termination = \n
# RESL8,FAST_OFF integration is documented at up to 5s (filter out) or 10s
# (filter in) per reading on DCV (Delay Default Table, p.5-71); the timeout
# is left generous to cover that plus bus overhead.
timeout_ms  = 60000
# "The controller addresses the 1281 as a listener with the Remote Enable
# management line true (Low). This returns the 1281 from local to remote
# control" ("Listen Address with REN true", p.5-7); front-panel controls
# are disabled (except Power) once in remote. REN is asserted here so the
# instrument is actually placed into remote before any command is sent.
assert_ren  = true
# *CLS clears the event registers and queues without touching the function,
# range or calibration state (p.5-83), so a prior operator setup survives.
# TRG_SRCE EXT is sent once here -- see the command-language note above --
# so that Controller-generated *TRG (and this config's X? query) actually
# trigger a reading instead of being ignored in favour of the free-running
# internal interval counter that is the power-on default (p.5-68).
init =
    *CLS
    TRG_SRCE EXT

[dcv]
# Nrf (here {range}) "represent[s] the expected signal amplitude, so that
# the instrument will go to the most relevant range. Any valid numeric
# value cancels autorange" (p.5-30); AUTO is accepted directly in the same
# slot (confirmed by the manual's "ACI AUTO,FILT40Hz" example, p.5-44), so
# {range} alone covers both a fixed range and AUTO -- no setup_auto needed.
setup =
    DCV {range},RESL8,FAST_OFF
setup_dwell_s     = 0.4
drain_after_setup = false
# No NPLC concept on this meter -- see the file header. RESL8,FAST_OFF
# (8.5 digits, the slowest/most accurate A-D mode) is baked into setup
# above instead; it is also this function's own power-on default
# resolution (RESL6 is the power-on *default*, but RESL8 is the documented
# maximum -- "Resolution RESL6 (max. is 8.5 digits)", p.5-31).
nplc = 10
# DCV ranges are decade 100 mV, 1 V, 10 V, 100 V and 1000 V (Nrf table,
# p.5-30: "0 to 0.199999999 selects the 100mV range" ... "20 to 199.999999
# selects the 100V range[;] >200 selects the 1000V range"), and the
# instrument's own power-on default range is 1kV (Appendix B, p.5-B1), so
# the 1000 V range is a real, selectable range -- the R6161's 1000 V output
# CAN be applied here.
max_input = 1000
# X? "is equivalent to performing an Execute Trigger followed by a reading
# query[:] X? = *TRG;RDG?[.] X? is intended for high speed use" (p.5-69).
# RDG? on its own "will wait for the completion of the measurement" before
# answering (p.5-74), so the query blocks until data is ready and no extra
# settle time is required beyond the setup dwell.
trigger  =
query    = X?
settle_s = 0.2
drain_before_read = false

[dci]
setup =
    DCI {range},RESL6,FAST_OFF
setup_dwell_s     = 0.4
drain_after_setup = false
# DCI tops out at RESL6 (6.5 digits) -- there is no RESL7/RESL8 token for
# this function ("Where X is in the range 4 to 6", p.5-42).
nplc = 10
# DCI ranges are decade 100 uA, 1 mA, 10 mA, 100 mA and 1 A (p.5-42: "0 to
# 0.0001999999 selects the 100uA range" ... ">0.2 selects the 1A range").
max_input = 1
trigger  =
query    = X?
settle_s = 0.2
drain_before_read = false

[ohmf]
# 4-wire ohms measures the standard resistors, so it wants accuracy over speed:
# offset compensation, a settling delay, and a long integration. Offset
# compensation matters most -- it reads twice, with and without the test
# current, and subtracts, removing the thermal EMF that otherwise dominates a
# 10 ohm measurement.
#
# UNVERIFIED: the offset-compensation command for this meter could not be
# sourced from its programming manual, so it is NOT set here rather than
# guessed -- a setup line the meter rejects would be silently swallowed. If your
# manual gives one, add it to the setup block below. What is set is the longest
# integration the meter accepts, which is safe and helps regardless.
# Plain OHMS with the FWR ("4-wire Ohms") modifier -- see the command-
# language note above for why TRUE_OHMS is not used here. Worked example in
# the manual: "'OHMS 10000,FWR,RESL8' selects 8.5 digits on the 10kOhm
# range, in 4-wire Ohms" (p.5-36).
setup =
    OHMS {range},FWR,RESL8,FAST_OFF
setup_dwell_s     = 0.4
drain_after_setup = false
# No NPLC concept -- RESL8,FAST_OFF (8.5 digits, slowest/most accurate)
# baked into setup above. OHMS supports RESL4..RESL8 (p.5-36/p.5-37).
nplc = 10
# OHMS (normal) covers 1 ohm .. 20 Mohm in decade ranges ("0 to 199.999999
# selects the 100 ohm range" ... "200000 to 1999999.99 selects the 1MOhm
# range[;] > 2000000 Use HI_OHMS", p.5-36) -- comfortably covers a ~10 ohm
# current-limit standard resistor.
trigger  =
query    = X?
settle_s = 0.2
drain_before_read = false
