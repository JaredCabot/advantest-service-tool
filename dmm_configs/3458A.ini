# ==========================================================================
# DMM configuration - HP / Keysight 3458A  (native "language 3458A" command set)
# Reference multimeter for the R6161 DCV / DCI / 4-wire-ohms measurements.
# Edit values to match your setup. Lines beginning with # are comments.
# ==========================================================================

[dmm]
name  = HP/Keysight 3458A
model = 3458A
digits = 8.5

[identify]
# The 3458A predates SCPI and answers "ID?" (returns "HP3458A"), not "*IDN?".
query = ID?
match = 3458A

[connection]
# interface: GPIB | USB | LAN
interface = GPIB
resource  =
# GPIB primary address (default 22).
address   = 22
gpib_template = GPIB0::{addr}::INSTR
lan_template  = TCPIP0::{addr}::inst0::INSTR
usb_template  = {addr}
# The 3458A terminates output with CR/LF and needs END ALWAYS + remote enable
# before it will accept commands from the bus at all.
read_termination  = \r\n
write_termination = \r\n
# timeout_ms is a FLOOR, not the value used. The driver derives the real I/O
# timeout from the integration time actually in use -- see the notes at the top
# of dmm_driver.py -- so raising nplc cannot make readings time out. At the
# nplc = 100 set below that works out around 31 s; at this meter's maximum of
# 1000 PLC, about three minutes.
timeout_ms  = 20000
# Mains frequency, used to turn nplc into an aperture in seconds. Omit it and
# 50 Hz is assumed, which over-estimates the time needed at 60 Hz rather than
# under-estimating it.
line_freq_hz = 50
assert_ren  = true
# END ALWAYS makes the 3458A assert EOI at the end of every response, not
# just at the end of a "group" of NRDGS readings -- required so PyVISA's
# read() sees a clean end-of-message on a single triggered reading.
init =
    END ALWAYS
# Sent once when a run finishes, to hand the meter back in a state a human
# recognises. A run leaves it on a fixed range at 100 PLC in TARM HOLD, where
# the display is frozen and the meter looks dead. This does not reset the
# meter's calibration -- PRESET NORM touches operating state only, never ACAL
# constants -- and END ALWAYS is re-sent because PRESET clears it.
restore =
    PRESET NORM
    END ALWAYS
    DCV AUTO
    NPLC 10
    NDIG 8
    AZERO ON
    TRIG AUTO
    NRDGS 1,AUTO

[dcv]
# DCV {range} accepts either a numeric range or the literal word AUTO, so
# this is safe when the caller passes "AUTO" as well as a fixed range.
# NDIG is the displayed resolution, from the `ndig` key below. On this meter
# it is a display setting and is independent of NPLC -- measured 28 July 2026,
# setting either does not move the other, in either order. It accepts 3 to 8
# and silently clamps 9 to 8.
# AZERO ON keeps the internal auto-zero cycle on for rated accuracy.
# TRIG AUTO and NRDGS 1,AUTO are set explicitly rather than inherited. Without
# them the block depends on however the meter was last left: if TRIG is sitting
# on an event that never arrives, TARM SGL arms and the read blocks until the
# VISA timeout, which looks like a dead meter rather than a configuration
# mistake. Measured 28 July 2026 -- this is what a 100 PLC reading failed on.
# TARM HOLD is last, parking the meter so a reading is only taken on an
# explicit TARM SGL, which read_one() below sends and reads as a query.
setup =
    DCV {range}
    NPLC {nplc}
    NDIG {ndig}
    AZERO ON
    TRIG AUTO
    NRDGS 1,AUTO
    TARM HOLD
setup_dwell_s     = 0.5
drain_after_setup = true
# Integration capability, declared so the tool reduces a request the
# meter cannot honour instead of sending a value it would refuse.
nplc_max = 1000
# Integration time actually used, in power-line cycles. Manual 7.2.2 note 7
# asks for "20 PLC or more"; 100 is two seconds an aperture at 50 Hz, and the
# measured spread over two samples of a 10 V point was 0.1 uV = 0.01 ppm of
# range. One reading then takes about ten seconds with AZERO ON, which is what
# timeout_ms above has to cover.
nplc = 100
# Displayed resolution, substituted into {ndig} in the setup block. 3 to 8.
ndig = 8
trigger  = TARM SGL
query    =
settle_s = 1.0
drain_before_read = true

[dci]
setup =
    DCI {range}
    NPLC {nplc}
    NDIG {ndig}
    AZERO ON
    TRIG AUTO
    NRDGS 1,AUTO
    TARM HOLD
setup_dwell_s     = 0.5
drain_after_setup = true
# Integration capability, declared so the tool reduces a request the
# meter cannot honour instead of sending a value it would refuse.
nplc_max = 1000
# Integration time actually used, in power-line cycles. Manual 7.2.2 note 7
# asks for "20 PLC or more"; 100 is two seconds an aperture at 50 Hz, and the
# measured spread over two samples of a 10 V point was 0.1 uV = 0.01 ppm of
# range. One reading then takes about ten seconds with AZERO ON, which is what
# timeout_ms above has to cover.
nplc = 100
# Displayed resolution, substituted into {ndig} in the setup block. 3 to 8.
ndig = 8
trigger  = TARM SGL
query    =
settle_s = 1.0
drain_before_read = true

[ohmf]
# Used to measure the standard resistors 4-wire so their real values, not
# their nominal ones, drive the current measurements.
#
# OCOMP ON is offset compensation: the meter takes the reading twice, with and
# without its test current, and subtracts. That removes any thermal EMF in the
# leads and at the resistor's terminals, which on a 10 ohm standard measured to
# a few ppm is the dominant error rather than a refinement.
#
# DELAY 1 gives the resistor and the leads a second to settle after the test
# current is applied, before the integration starts.
#
# NPLC 200 rather than the 100 used for voltage: offset compensation doubles the
# number of integrations, and a resistance measured once at the start of a run
# is worth more time than a reading taken at 45 points.
setup =
    OHMF {range}
    OCOMP ON
    DELAY 1
    NPLC {nplc}
    NDIG {ndig}
    AZERO ON
    TRIG AUTO
    NRDGS 1,AUTO
    TARM HOLD
setup_dwell_s     = 0.5
drain_after_setup = true
# Integration capability, declared so the tool reduces a request the
# meter cannot honour instead of sending a value it would refuse.
nplc_max = 1000
# Integration time actually used, in power-line cycles. Manual 7.2.2 note 7
# asks for "20 PLC or more"; 100 is two seconds an aperture at 50 Hz, and the
# measured spread over two samples of a 10 V point was 0.1 uV = 0.01 ppm of
# range. One reading then takes about ten seconds with AZERO ON, which is what
# timeout_ms above has to cover.
nplc = 200
# Displayed resolution, substituted into {ndig} in the setup block. 3 to 8.
ndig = 8
trigger  = TARM SGL
query    =
settle_s = 1.0
drain_before_read = true
