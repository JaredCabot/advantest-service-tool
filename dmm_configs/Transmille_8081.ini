# ==========================================================================
# DMM configuration - Transmille 8081 Precision Multimeter (8000 Series)
#
# The 8000 Series Operation Manual (V4.20) covers only the 8071, 8081 and
# 8080 -- "Product Name: Multimeter / Model Number: 8071 / 8081" (Declaration
# of Conformity) and "The 8000 Series multimeters are available in 2 accuracy
# grades - the 8081 / 8080 4ppm model and the 8071 of 9ppm model." (p.7). The
# model 8104 named alongside the 8081 in this task is NOT mentioned anywhere
# in this manual; nothing here should be assumed to apply to it.
#
# The manual never states a digit count for any model (no "8.5 digit" text
# anywhere in the document -- the only digit-related command is the display
# resolution setter "D<Digits> Digits = 4 to 8", p.62, which is generic
# across the family, not a per-model spec). ``digits = 8.5`` below follows
# Transmille's external product literature/convention for this accuracy
# grade, NOT this manual -- UNVERIFIED, confirm against the 8081 datasheet.
#
# COMMAND LANGUAGE: the manual's "Remote Programming" section (p.59-64) is a
# small, direct command set, not full SCPI (it explicitly has its own short
# section titled "SCPI" that is really just command-syntax rules: colon-
# separated words, a space before the parameter, case-insensitive). Commands
# terminate in a bare Carriage Return (ASCII 13); LF may also be present.
# There is no NPLC concept: integration/speed is a discrete "Filter Range"
# code F1-F9 (250ms...64s), so {nplc} is deliberately never referenced below.
# There is also no documented remote *RST/*CLS/autorange command.
#
# CONFIDENCE: medium. Command syntax, ranges, terminator and *IDN? presence
# are direct quotes from the manual. UNVERIFIED against the manual text (see
# inline notes): default GPIB address, literal *IDN? response text, whether
# any literal "AUTO" range keyword is accepted remotely (none is documented;
# setup_auto below substitutes the top of each range instead), the USB
# resource type (the manual says USB uses an "FTDI USB Driver", i.e. a
# virtual COM port, not USB-TMC, so the usb_template default of a raw
# resource string is unlikely to be right without checking), and the LAN/
# Ethernet VISA resource format (only DHCP/static IP front-panel setup is
# documented, no socket/VXI-11 details).
#
# Sources:
#   /tmp/manuals/Transmille_8000_Series_Operation_Manual_V4.20.txt (8000
#   Series Precision Digital Multimeter Operation Manual, Version 4.20,
#   April 2010) -- "Remote Programming" p.59 onward, "GPIB (IEEE488)" p.6.
# ==========================================================================

[dmm]
name   = Transmille 8081 Precision Multimeter
model  = 8081
# UNVERIFIED against this manual -- see header note. The manual only gives a
# generic "Digits = 4 to 8" display-resolution range (p.62), not a per-model
# digit count.
digits = 8.5

[identify]
query = *IDN?
# UNVERIFIED: the manual lists "Identification String *IDN?" (p.61) but shows
# no example response text. "8081" is the best available substring given the
# model name; confirm the live response before relying on it.
match = 8081

[connection]
interface = GPIB
resource  =
# UNVERIFIED: no factory-default GPIB address is given anywhere in this
# manual. The address is set from the front-panel Settings menu ("Set GPIB
# address", p.30) or remotely with COMMUNICATE:GPIB:ADDRESS <address>,
# Address = {1-30} (p.63). Confirm/set the real address before use.
address   = 1
gpib_template = GPIB0::{addr}::INSTR
# UNVERIFIED: the manual documents only front-panel DHCP/static-IP setup for
# the Ethernet interface (p.13), not a VISA/VXI-11 resource string.
lan_template  = TCPIP0::{addr}::inst0::INSTR
# UNVERIFIED: USB uses "FTDI USB Driver (Supplied)" (p.13) -- a virtual COM
# port, not USB-TMC -- so a plain VISA USB0::... resource is unlikely to work
# here; {addr} is expected to be a full ASRL/COM-port VISA resource string.
usb_template  = {addr}
# "The required terminator for the commands to be detected by the multimeter
# is a carriage return (ASCII character 13) and should be the last character
# sent on a command line" (p.60). Responses (e.g. command response codes) are
# shown terminated "<cr><lf>" (p.60), so read up through the line feed.
read_termination  = \n
write_termination = \r
# Filter times run up to 64s (see [dcv] notes); allow room for a slow filter.
timeout_ms  = 60000
assert_ren  = false
# No connect-time init: the manual's command set has no documented *RST or
# *CLS equivalent (its own SCPI-labelled table lists only READ?/*TRG,
# RANGE:... setters and *IDN? -- p.61), so nothing is sent here that would
# risk disturbing the front-panel setup.
init =

[dcv]
# "Select DC Voltage Range   RANGE:DC:VOLTAGE <value>  /  RANGE:DC:VOLT
# <value>   value = 0.1 to 1000" (p.61). Confirmed by the worked example:
# "1V DC @ 2s Filter   RANGE:DC:VOLT   1   /   F4   <CR>" (p.61).
#
# Filter/speed has no NPLC concept -- it is a discrete code:
# "Set Filter Range   F<Filter Range>   Filter Range = 1 to 9 for filter
# times 250ms,500ms,1s,2s,4s,8s,16s,32s,64s" (p.62). F5 (4s) is used below as
# a fixed, generally-precise default; {nplc} is intentionally not referenced.
# "Set Digits   D<Digits>   Digits = 4 to 8" (p.62) is sent for maximum
# display/reading resolution.
setup =
    RANGE:DC:VOLT {range}
    D8
    F5
# No remote "AUTO" range keyword is documented anywhere in the Remote
# Programming section -- RANGE:DC:VOLT only accepts a numeric value 0.1-1000
# (p.61). This block substitutes the top of the documented range (1000, i.e.
# up to 1025V absolute max input, p.6/p.16/p.24) as the closest available
# stand-in for autorange; UNVERIFIED whether the instrument's own analogue
# autoranging then narrows in on smaller signals, or whether it stays pinned
# to the 1000V range. Check against a live unit before relying on this for
# small signals.
setup_auto =
    RANGE:DC:VOLT 1000
    D8
    F5
setup_dwell_s     = 0.4
drain_after_setup = false
# DCV range parameter is 0.1 to 1000 (p.61); "AC/DC Volts to 1025V" (p.6) and
# the 1025V-rated input terminals/leads (p.16, p.24) put the true maximum
# input above the 1000 documented in the range table, so DCV genuinely
# accepts a 1000 V input -- max_input is deliberately NOT set here.
trigger  =
# "Transmit Reading   READ?   /   *TRG" (p.61).
query    = READ?
settle_s = 0.5
drain_before_read = false

[dci]
# "Select DC Current Range   RANGE:DC:CURRENT <value>  /  RANGE:DC:CURR
# <value>   value = 10-8 to 30" (p.61, "10-8" is the manual's rendering of
# 10^-8, i.e. down to 10 nA). Confirmed by the worked example: "100mA DC @
# 500ms Filter   RANGE:DC:CURR   0.1   /   F2   <CR>" (p.61).
setup =
    RANGE:DC:CURR {range}
    D8
    F5
# As with [dcv], no remote autorange keyword is documented; this substitutes
# the top of the documented current range (30, matching "AC/DC Current to 30
# Amps", p.6, and the dedicated 30A high-current input, p.16/p.24).
setup_auto =
    RANGE:DC:CURR 30
    D8
    F5
setup_dwell_s     = 0.4
drain_after_setup = false
trigger  =
query    = READ?
settle_s = 0.5
drain_before_read = false

[ohmf]
# 4-wire ohms measures the standard resistors, so it wants accuracy over speed:
# offset compensation, a settling delay, and a long integration. Offset
# compensation matters most -- it reads twice, with and without the test
# current, and subtracts, removing the thermal EMF that otherwise dominates a
# 10 ohm measurement.
#
# UNVERIFIED: the offset-compensation command for this meter could not be
# sourced from its programming manual, so it is NOT set here rather than
# guessed -- a setup line the meter rejects would be silently swallowed. If your
# manual gives one, add it to the setup block below. What is set is the longest
# integration the meter accepts, which is safe and helps regardless.
# "Select 4-Wire Resistance   RANGE:FRES <value>  /  RANGE:FRESISTANCE
# <value>   value=1 to 107" (p.61, "107" is the manual's rendering of 10^7,
# i.e. up to 10 MOhm -- consistent with "Selecting ranges above 10 MOhms
# will activate electrometer mode" for 2-wire, p.45).
#
# The front panel also offers "OHMS COMPENSATION ... Compensates for thermal
# voltages" (p.44/46), but no remote command for it is documented anywhere in
# the Remote Programming section, so it cannot be set from here; whatever
# state was last left on the front panel applies. UNVERIFIED: check with
# Transmille whether a remote offset-compensation command exists outside
# this manual.
setup =
    RANGE:FRES {range}
    D8
    F5
setup_auto =
    RANGE:FRES 10000000
    D8
    F5
setup_dwell_s     = 0.4
drain_after_setup = false
trigger  =
query    = READ?
settle_s = 0.5
drain_before_read = false
