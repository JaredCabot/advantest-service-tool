# ==========================================================================
# DMM configuration - Fluke 8588A Reference Multimeter  (SCPI)
#
# 8.5 digit. A current-production reference multimeter, and one of the few
# instruments in the same accuracy class as the 3458A.
#
# CONFIDENCE: high. Every command below (CONFigure/SENSe tree, NPLC bounds,
# trigger model, *IDN? form, DCV range) is quoted from the 8588A/8558A Remote
# Programmer's Manual, March 2019 Rev. 1, 2/25 (local copy at
# /tmp/manuals/Fluke_8588A_8558A_Remote_Programmers_Manual.txt; line numbers
# below refer to that file). The one item the manual does not state is the
# factory-default GPIB address - see [connection] below.
#
# Trigger model: entering a command over any remote interface takes the
# meter out of free-run and into the Idle state (manual p.60: "Entering
# commands via the GPIB places the DMM in Remote control. This causes the
# Trigger system to enter the IDLE state (INITiate:CONTinuous OFF). The DMM
# must be triggered before a reading can be retrieved."). READ? is documented
# (p.17) as being "the same as sending the TRIGger commands: ABORt;
# INITiate:IMMediate;FETCh?", so a bare READ? query is used below rather than
# a separate trigger + FETCh?.
#
# Integration time: the meter takes SENSe:<fn>:NPLC directly, not just an
# APERture in seconds, so the tool's {nplc} contract (power-line cycles)
# applies unmodified. Table 7 (p.42-43) states, for DCV/DCI/2-wire and 4-wire
# resistance alike: "NPLC Min = 0 Max = 600" - a continuous range, not a
# discrete set, hence nplc_max rather than nplc_values below.
#
# Offset compensation: no OCOM-style command exists in this manual for
# FRESistance. There is a :MODE NORMal|TRUE|HIV selector (p.28, line 1617)
# but the manual never defines what TRUE mode does, so it is not used here -
# NORMal is the safe, documented default 4-wire mode. If offset-compensated
# ohms is required, investigate FRESistance:MODE TRUE against the Operators
# Manual before relying on it.
#
# The sibling 8558A shares this entire command set (the Remote Programmer's
# Manual documents both under the umbrella term "the Product"); see
# Fluke_8558A.ini. The only place a real difference could hide is accuracy
# specification, which is not covered by a Remote Programmer's Manual at all.
#
# Sources:
#   Fluke 8588A/8558A Reference Multimeter and 8 1/2 Digit Multimeter Remote
#   Programmer's Manual, March 2019 Rev. 1, 2/25 (c) Fluke Corporation.
#   https://www.fluke.com/en-us/product/calibration-tools/electrical-calibration/bench-multimeters/8588a
# ==========================================================================

[dmm]
name   = Fluke 8588A Reference Multimeter
model  = 8588A
digits = 8.5

[identify]
query = *IDN?
match = 8588A

[connection]
# GPIB, USBTMC-USB488 and Ethernet are all documented remote interfaces
# (manual p.1: "The Product supports remote control GPIB, USBTMC-USB488, and
# Ethernet."). Only one port is active at a time - it is selected from the
# front-panel Remote Settings menu, or remotely with
# SYSTem:COMMunicate:ENABLE USB|GPIB|ENET (line 3061-3062) - so GPIB will not
# respond unless it has been made the active port.
interface = GPIB
resource  =
# UNVERIFIED: the manual documents that GPIB addresses are user-assigned in
# the range 1-30 (p.5, "About the Bus Address") but states no factory-default
# numeric value anywhere in this document. Read it from Q > Remote Settings >
# GPIB Address on the meter, or prefer the LAN/USB interface instead, where
# no address needs to be guessed.
address   = 22
gpib_template = GPIB0::{addr}::INSTR
lan_template  = TCPIP0::{addr}::inst0::INSTR
usb_template  = {addr}
# The Ethernet EOL setting defaults to LF (p.8: "EOL / Default: LF can also
# be set to CR CRLF"); \n matches that default.
read_termination  = \n
write_termination = \n
timeout_ms  = 120000
assert_ren  = false
# The manual's own "Prepare the Product for ... Remote Control" sections
# (pp.6-8), repeated identically for GPIB, USBTMC-USB488 and Ethernet, give
# this as the recommended connect sequence: "Clear registers and read the
# status byte: Write: *CLS;*RST". Unlike the 34420A there is no filter or
# channel state worth preserving across *RST here, so it is sent as
# documented.
init =
    *CLS
    *RST

[dcv]
# CONFigure:VOLTage:DC [<range>|MIN|MAX|DEF[,<resolution>|MIN|MAX|DEF]]
# (p.13, line 723). The range parameter is a "maximum expected value", not a
# literal AUTO: "SENSe:VOLTage:DC:RANGe <nrf>|MINimum|MAXimum|DEFault ...
# The <nrf> would be a value between 2.03 and 20.02 to select the 10 V
# range." (p.11, lines 594-597) - so autoranging needs the separate
# :RANGe:AUTO[:STATe] <boolean> command (p.35, line 2172) and gets its own
# setup_auto block below, same pattern as every other SCPI meter in this
# folder.
#
# DCV range: Table 7 (p.42) gives "Range: 1000 (Min 0.1, Max 1000)" for DCV,
# i.e. the meter takes the full 1000 V the R6161 can put out; no max_input
# is declared.
setup =
    CONF:VOLT:DC {range}
    SENS:VOLT:DC:NPLC {nplc}
setup_auto =
    CONF:VOLT:DC
    SENS:VOLT:DC:RANG:AUTO ON
    SENS:VOLT:DC:NPLC {nplc}
setup_dwell_s     = 0.5
drain_after_setup = false
# Table 7 (p.42): "Aperture: AUTO (default 1 second, Min 0, Max 10 seconds),
# NPLC Min = 0 Max = 600" - a continuous range, not a discrete set.
nplc_max = 600
nplc = 10
trigger  =
# READ? "is the same as sending the TRIGger commands: ABORt;
# INITiate:IMMediate;FETCh?" (p.17, Table 5) - triggers and returns the
# reading in one query.
query    = READ?
settle_s = 0.5
drain_before_read = false

[dci]
# CONFigure:CURRent:DC [<range>|MIN|MAX|DEF[,<resolution>|MIN|MAX|DEF]]
# (p.13, line 715). Table 7 (p.42) gives the DCI default range as 30 (A).
setup =
    CONF:CURR:DC {range}
    SENS:CURR:DC:NPLC {nplc}
setup_auto =
    CONF:CURR:DC
    SENS:CURR:DC:RANG:AUTO ON
    SENS:CURR:DC:NPLC {nplc}
setup_dwell_s     = 0.5
drain_after_setup = false
# Table 7 (p.42): "Aperture: AUTO (default 1 second, Min 0, Max 10 seconds),
# NPLC Min = 0 Max = 600" for DCI, same continuous range as DCV.
nplc_max = 600
nplc = 10
trigger  =
query    = READ?
settle_s = 0.5
drain_before_read = false

[ohmf]
# 4-wire ohms measures the standard resistors, so it wants accuracy over speed:
# offset compensation, a settling delay, and a long integration. Offset
# compensation matters most -- it reads twice, with and without the test
# current, and subtracts, removing the thermal EMF that otherwise dominates a
# 10 ohm measurement.
#
# UNVERIFIED: the offset-compensation command for this meter could not be
# sourced from its programming manual, so it is NOT set here rather than
# guessed -- a setup line the meter rejects would be silently swallowed. If your
# manual gives one, add it to the setup block below. What is set is the longest
# integration the meter accepts, which is safe and helps regardless.
# CONFigure:FRESistance [<range>|MIN|MAX|DEF[,<resolution>|MIN|MAX|DEF]]
# (p.13, line 727); FRES is the documented short form (p.16, line 799: "The
# response to CONFige? for the functions ... FRES, RES, ...").
# [:SENSe]:FRESistance:MODE NORMal|TRUE|HIV (p.28, line 1617) sets the
# 4-wire Ohms mode; NORMal is used explicitly below rather than left
# implicit, since no OCOM-equivalent command exists in this manual to fall
# back on - see the header comment for why TRUE mode is not used.
setup =
    CONF:FRES {range}
    SENS:FRES:NPLC {nplc}
    SENS:FRES:MODE NORM
setup_auto =
    CONF:FRES
    SENS:FRES:RANG:AUTO ON
    SENS:FRES:NPLC {nplc}
    SENS:FRES:MODE NORM
setup_dwell_s     = 0.5
drain_after_setup = false
# Table 7 (p.42-43): "Resistance 4W Normal ... Aperture: AUTO (default 1
# second, Min 100 us, Max 10 seconds), NPLC Min = 0 Max = 600".
nplc_max = 600
nplc = 200
trigger  =
query    = READ?
settle_s = 0.5
drain_before_read = false
