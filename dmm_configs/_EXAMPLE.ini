# ==========================================================================
# DMM configuration TEMPLATE  --  R6161 reference-multimeter driver
# ==========================================================================
#
# This is a fully annotated, blank example config. To use it:
#   1. Copy this file to a new file in this folder (dmm_configs/) named after
#      your instrument, for example  My_Bench_DMM.ini
#   2. Fill in the values for your DMM (you only need the keys that differ
#      from the defaults noted below).
#
# Every *.ini file in this folder is offered as a DMM choice by the R6161
# tool. Files whose name BEGINS WITH AN UNDERSCORE (like this one) are
# treated as templates and are NOT listed, so this file will never appear
# as a choice.
#
# What the DMM is for
# --------------------
# The R6161 procedures need a trusted reference multimeter to check the
# unit-under-test's own DC volts, DC current and (optionally) a precision
# 4-wire-ohms standard resistor. Readings are needed across a huge span --
# 10 microvolts to 1000 volts -- so a single fixed range/integration-time
# setting cannot serve the whole procedure. Each reading therefore names an
# explicit range, and the config expresses the DMM's command language with
# placeholders that get substituted at run time: {range}, {nplc} and, for the
# meters that have such a command, {ndig}.
#
# The range comes from the calling procedure, because it depends on the point
# being measured. The integration time and displayed resolution do NOT -- they
# are properties of the meter, so they come from the 'nplc' and 'ndig' keys in
# this file. Nothing in the R6161 tool overrides them.
#
# THE {range} / {nplc} PLACEHOLDERS -- THE ONE RULE THAT MATTERS MOST
# ---------------------------------------------------------------------
# {range} is substituted with whatever the calling procedure needs: a plain
# number (10, 1000, .1, ...) OR the literal string "AUTO" when the step asks
# the meter to autorange instead of using a fixed range. {nplc} is always an
# integer.
#
# Because the same setup block is reused for every call, with no branching,
# YOUR SETUP BLOCK MUST BE SAFE WHEN {range} IS SUBSTITUTED WITH THE LITERAL
# TEXT "AUTO". Concretely that means one of:
#   (a) your instrument's range command genuinely accepts the word AUTO as a
#       parameter value (true of the Keysight/Agilent-style CONF:VOLT:DC
#       command family, and of the HP 3458A/3457A DCV/DCI/OHMF commands) --
#       then a plain  "...:RANG {range}"  or  "DCV {range}"  line is fine; or
#   (b) it does not, in which case send an unconditional autorange-enable
#       command FIRST, then a best-effort explicit-range command SECOND, e.g.
#           :SENS:VOLT:DC:RANG:AUTO ON
#           :SENS:VOLT:DC:RANG {range}
#       When {range} is a number this sets the fixed range (which on most
#       SCPI meters also turns autorange back off); when {range} is "AUTO"
#       the second line is simply rejected by the instrument as a bad
#       parameter (harmless -- it lands in the error queue, nothing raises,
#       and autorange from the first line is left in effect) -- see the
#       Keithley 2002 config in this folder for a worked
#       example; or
#   (c) your instrument's range command uses fixed range CODES that do not
#       correspond to engineering-unit values at all (the HP 3478A's
#       R0..R6/RA scheme is like this) -- in that case do not template
#       {range} into the command at all; always autorange, and say so in a
#       comment (see Prema_6048.ini).
# Whichever pattern you use, run the verification snippet the R6161 tool
# ships with (or simply call `"\n".join(setup_lines).format(range="AUTO",
# nplc=10)` yourself) before trusting a new config.
#
# File syntax
# -----------
#   * Lines beginning with '#' or ';' are comments.
#   * Section names are in [brackets]; settings are written as  key = value
#   * Some keys take a BLOCK of commands: leave the value after '=' empty and
#     put one command per line, indented, on the following lines (see the
#     [connection] 'init' and [dcv] 'setup' keys below).
#   * In read_termination / write_termination the escapes \r \n \t are
#     decoded to carriage-return / line-feed / tab.
#   * A key that is present but left blank is treated as ABSENT -- it falls
#     back to its default, exactly as if the line were deleted. This lets
#     you list every key (for documentation) without having to fill in ones
#     you don't need.
#   * Each key below notes its "default:" -- the value used if the key is
#     omitted or left blank -- so you only need to set what differs.
# ==========================================================================


[dmm]
# Free-text name shown in the tool's menus and on certificates.
#   default: the config file name
name  =
# Model string for your instrument (e.g. 3458A, 34461A). Also used as the
# bus-scan match when [identify] 'match' below is left blank.
model =


[identify]
# Used by the "Bus scan" menu item to recognise this instrument on the VISA
# bus and prefer its actual live address over the static address configured
# below.
#
# query : the identification query to send when re-identifying an already-
#         opened session (the bus scan itself always tries "*IDN?" then
#         "ID?" regardless of this setting -- this key only affects
#         DMM.identify() on a live connection).
#         default: *IDN?
#         Most modern (SCPI) instruments answer *IDN?. Some pre-SCPI HP
#         instruments (e.g. the 3458A/3457A) answer "ID?" instead. A few
#         very old instruments (e.g. the HP 3478A) answer neither and
#         cannot be identified remotely at all -- leave this blank in
#         that case and select the config manually.
# match : a case-insensitive substring expected in the identify response.
#         default: the [dmm] 'model' value above.
#         Make it broad enough to cover a family if desired, e.g. "3441"
#         matches both the 34410A and 34411A. Keep it narrow enough that it
#         cannot also match an unrelated model that happens to share digits.
query =
match =


[connection]
# --- How to reach the instrument -----------------------------------------
# interface : GPIB | USB | LAN     (LAN, TCPIP and ETHERNET are equivalent)
#             default: GPIB
interface =
# resource  : a full VISA resource string. If set, it is used verbatim and
#             the 'address' + template keys below are ignored. Leave blank
#             to build the resource automatically from 'interface' +
#             'address'.
#             Examples:
#               GPIB0::22::INSTR
#               TCPIP0::192.168.1.100::inst0::INSTR
#               USB0::0x2A8D::0x1301::MY12345678::INSTR
#             default: (blank)
resource  =
# address   : GPIB primary address (e.g. 22), or a LAN IP address / hostname,
#             used when 'resource' is blank. For USB it is easiest to put
#             the full string in 'resource' instead.
#             default: (blank)
address   =
# Templates that build the resource string from 'address' (the {addr} field
# is replaced by the 'address' value). You rarely need to change these.
#   gpib_template  default: GPIB0::{addr}::INSTR
#   lan_template   default: TCPIP0::{addr}::inst0::INSTR
#   usb_template   default: {addr}
gpib_template =
lan_template  =
usb_template  =

# --- Link settings -------------------------------------------------------
# read_termination / write_termination : line endings for I/O.
#   default for both: \n      (the 3458A/3457A, for example, need \r\n)
read_termination  =
write_termination =
# timeout_ms : I/O timeout in milliseconds -- a FLOOR, not the value used.
#              default: 20000
#
#              The time one reading takes is dominated by the integration
#              aperture, which is nplc / line-frequency seconds and scales
#              without limit, so a fixed timeout cannot survive someone
#              changing 'nplc'. The driver therefore derives the real timeout:
#
#                  timeout = (nplc / line_freq) x apertures
#                            + read_overhead_s + settle_s
#
#              and uses whichever is larger, this floor or that. Set this to
#              cover whatever your meter is slow at for reasons unrelated to
#              integration; leave the integration part to the formula.
timeout_ms  =
# line_freq_hz : mains frequency, used to turn 'nplc' into an aperture in
#                seconds for the timeout formula above.
#                default: 50
#                50 is assumed rather than 60 because it over-estimates the
#                time a reading needs rather than under-estimating it. There
#                is no reason to set this unless you want the timeout margin
#                to be tighter on a 60 Hz supply.
line_freq_hz =
# assert_ren : true to assert GPIB Remote Enable on connect. Needed by
#              pre-SCPI HP instruments (3458A, 3457A, 3478A) before they will
#              accept remote commands at all. Accepts true / false.
#              default: false
assert_ren  =
# init : commands sent ONCE immediately after connecting, one per indented
#        line. Leave blank if none are needed. Example for the 3458A:
#          init =
#              END ALWAYS
init =


[dcv]
# --- DC volts: one-time setup ---------------------------------------------
# setup : commands sent once to configure the DC-volts function, one per
#         indented line. {range} and {nplc} are substituted via str.format
#         -- see the placeholder rule at the top of this file. Example
#         (Keysight-style SCPI):
#           setup =
#               CONF:VOLT:DC {range}
#               VOLT:DC:NPLC {nplc}
setup =
# setup_dwell_s     : seconds to wait after EACH setup line.
#                     default: 0.4
setup_dwell_s     =
# drain_after_setup : true to flush the input buffer after setup completes
#                     (needed for free-running pre-SCPI meters like the
#                     3458A that may still be emitting readings).
#                     Accepts true / false.        default: false
drain_after_setup =
# nplc : integration time in power-line cycles. This is the value normally
#        used: the R6161 engines pass no integration time of their own, so
#        whatever is set here is what every reading gets. Keep it inside the
#        instrument's supported range (check the model's manual -- some only
#        accept a short discrete list such as 0.02/0.2/1/10/100), and use
#        'nplc_values' or 'nplc_max' below to declare that limit.
#        Manual 7.2.2 note 7 asks for 20 PLC or more; the 3458A config uses
#        100. Longer integration costs time and buys noise performance --
#        one 100 PLC reading on the 3458A takes about ten seconds with
#        auto-zero on, so make sure 'timeout_ms' above covers it.
#        default: 10
nplc =
# ndig : displayed resolution, for meters that expose it separately from the
#        integration time -- NDIG on the 3458A, which accepts 3 to 8. Only
#        used if the 'setup' block above references {ndig}; a setup block
#        that references it without this key being set is refused at setup
#        time rather than sending a malformed command.
#        Note that on the 3458A this is a DISPLAY setting and is independent
#        of nplc: setting either does not move the other, and the meter
#        returns full resolution over the bus regardless.
#        default: (blank -- {ndig} unusable)
ndig =
# nplc_apertures  : how many whole integration apertures ONE reading costs on
#                   this meter, used by the read-timeout formula in
#                   [connection] above. More than one because an auto-zero
#                   cycle is itself a full-length integration.
#                   default: 8
#                   Measured on the 3458A: 5 apertures at 100 PLC and 3.5 at
#                   200 PLC, so the default leaves a comfortable margin. Raise
#                   it only if a slow meter still times out.
# read_overhead_s : fixed allowance on top, for command handling, the drain
#                   and the transfer.        default: 15
nplc_apertures  =
read_overhead_s =

# --- Taking one reading ----------------------------------------------------
# How a single reading is taken depends on which of 'trigger' / 'query' are
# set:
#   * trigger set, query blank : 'trigger' is sent as a QUERY and its
#                                response is the reading (e.g. the 3458A's
#                                "TARM SGL").
#   * trigger set, query set   : 'trigger' is written, then 'query' is asked.
#   * trigger blank, query set : 'query' is asked (e.g. the SCPI "READ?").
#   * both blank                : a bare read() is performed (e.g. a
#                                meter left in a triggered-by-being-read
#                                mode, such as the HP 3478A's "T3").
# The first number found in the response is used as the value.
#
# trigger : default: (blank)
trigger  =
# query   : default: (blank)
query    =
# settle_s : seconds to wait after triggering, before reading.
#            default: 0.5
settle_s =
# drain_before_read : true to flush any stale/free-running readings before
#                     each read. Accepts true / false.  default: false
drain_before_read =


[dci]
# --- DC amps: identical shape to [dcv], see the comments there. -----------
setup =
setup_dwell_s     =
drain_after_setup =
nplc =
trigger  =
query    =
settle_s =
drain_before_read =


[ohmf]
# --- 4-wire ohms: identical shape to [dcv], see the comments there. -------
# Only needed if this DMM will be used to measure the current-limit standard
# resistor so its real value is used instead of its nominal value; omit this
# whole section if the instrument has no 4-wire-ohms capability.
setup =
setup_dwell_s     =
drain_after_setup =
nplc =
trigger  =
query    =
settle_s =
drain_before_read =

# ==========================================================================
# ADDITIONAL KEYS
#
# These were added after the first set of configs was written. All are
# optional; a config that omits them behaves exactly as before.
# ==========================================================================

# --- [dmm] digits ---------------------------------------------------------
# The instrument's resolution class, e.g. "8.5" or "6.5 / 7.5". Shown in the
# meter-selection menu so the operator can see at a glance whether a meter is
# adequate for the instrument being calibrated. The R6161's own 90-day
# specification is 25 ppm of setting on the 1 V and 10 V ranges, which makes a
# 6.5 digit meter marginal and a 7.5 or 8.5 digit meter comfortable.
#
#   [dmm]
#   digits = 8.5

# --- setup_auto -----------------------------------------------------------
# An alternative setup block, used INSTEAD of "setup" when the caller asks for
# the AUTO range. Autoranging is expressed differently on every meter and is
# rarely a value the range parameter itself accepts: the 34401A documents its
# range parameter as {<range>|MIN|MAX|DEF} with no AUTO among them, and the
# Keithley dialect needs a separate :RANG:AUTO ON. Without this key the
# ordinary block is used with the literal word AUTO substituted, which is
# correct only for the meters that genuinely accept it.
#
#   [dcv]
#   setup =
#       CONF:VOLT:DC {range}
#       VOLT:DC:NPLC {nplc}
#   setup_auto =
#       CONF:VOLT:DC
#       VOLT:DC:RANG:AUTO ON
#       VOLT:DC:NPLC {nplc}

# --- nplc_values / nplc_max ----------------------------------------------
# What integration times this meter will actually accept. The tool asks for
# 20, 50 or 100 power-line cycles depending on how small the signal is, but
# meters differ sharply: the 34401A takes only 0.02, 0.2, 1, 10 or 100 and
# nothing between, while the Keithley 2001 stops at 10. Sending an
# unsupported value produces a settings-conflict error and, on some meters,
# silently leaves the previous integration in force - which would corrupt a
# measurement with no outward sign.
#
# Declare EITHER the exact allowed set OR a simple ceiling. The request is
# reduced to the largest allowed value not exceeding it, so a caller always
# gets at least as fast a reading as it asked for and never an invalid one.
#
#   nplc_values = 0.02,0.2,1,10,100
#   nplc_max    = 10
#
# If the meter has no NPLC concept at all - the Fluke 8508A and Datron 1281
# select resolution with RESL5..RESL8 rather than an integration time - then
# do not reference {nplc} anywhere in the setup blocks, and say so in a
# comment so the omission reads as deliberate.

# --- max_input ------------------------------------------------------------
# The largest input this meter accepts on this function, in SI base units.
# This is a safety key, not an accuracy one. Both procedures skip any point
# that exceeds it and record the point as "Not tested (exceeds reference
# limit)" rather than applying it.
#
# The case that motivated it: the Keysight 34420A is the best available choice
# on the R6161's Divider ranges, but its highest range is 100 V, and the
# generator's 1000 V range would otherwise be applied to its terminals.
#
#   [dcv]
#   max_input = 100

# --- omitting a function section -----------------------------------------
# A meter that genuinely lacks a function should simply have no section for
# it. The tool reports this when the meter is selected and skips the affected
# group. Say in a comment that the omission is deliberate, so a later reader
# does not "fix" it. The worked example in this folder is the Keysight
# 34420A, a nanovolt meter with no DC current function and therefore no
# [dci] section.
