# ==========================================================================
# DMM configuration - PREMA DMM 6048 (also covers the 6047; see digits note)
#
# Pre-SCPI, single/double-letter ASCII command set over IEEE-488. This config
# is written for the 6048, the 8.5-digit model - see line 442 and line 704
# of the manual:
#   line 442: "The 7 1/2 and 8 1/2 digit PREMA Digital Multimeters: 6047 and
#              6048 are top class instruments..."
#   line 704: "...readout of measurement results with up to 7 1/2 digits and
#              8 1/2 digits (6048) respectively..."
# so the 6048 is 8.5 digit and the 6047 is the 7.5-digit sibling. The two
# share one manual and (per section 8) an identical command set; a 6047 could
# reuse this file, but its Tx table tops out one digit lower - see [dcv].
#
# IMPORTANT LIMITATION - READ BEFORE USE, encoded below in [dcv]/[ohmf]:
#   PREMA's remote range command ("Rx") takes a fixed designation CODE
#   (R1..R7), not an engineering-unit value, and the code boundaries
#   (0.2/2/20/200/1000 V) do not correspond to a formattable transform of the
#   plain numbers ("0.1", "1", "10", ...) the R6161 engines pass as {range}.
#   Per the _EXAMPLE.ini template's option (c) for coded-range instruments,
#   {range} is therefore NOT used in the command text at all: this config
#   always autoranges on DCV and OHMF.
#   NPLC has no equivalent either (integration is set by a Tx CODE covering
#   20 ms to 80 sec, jointly with displayed digits) - {nplc} is likewise not
#   referenced; a fixed Tx is hard-coded and explained in [dcv].
#
# CONFIDENCE: medium-high. The function/range/integration/trigger command
# tables were read from two independent, mutually-consistent listings in the
# same manual (8.2.1 at lines 4570-4664, and the device-message glossary at
# lines 4979-5063); the address, terminator table and DCV range/overload
# figures are single, clearly-printed values. Marked UNVERIFIED below:
# whether REN is strictly required before the instrument accepts its first
# command (inferred from its RL1 capability code, not an explicit sentence),
# and whether a trailing terminator byte on a WRITTEN command is silently
# accepted (the manual only documents the terminator table as governing the
# instrument's own OUTPUT). All pages in the IEEE-bus chapter used here
# (manual pages 8/1 through 8/24, lines 4132-5495) carry visible page-footer
# markers with real text on both sides of every marker, so none of the
# manual's six OCR-failed pages fall inside the material this file relies
# on. The "O2"/"O4" resistance-function tokens are rendered as digit-look
# characters by the OCR; the letter is "O" for Ohm (matches the mnemonic
# pattern V=volt/I=current/T=temperature, and is corroborated by the
# manual's own gloss "(Ohm 2-wire)"/"(Ohm 4-wire)" at lines 4578/4580 and a
# second independent gloss "Resistance measurement, four-wire configuration"
# at line 4993) - not the digit zero.
#
# Sources:
#   Local OCR copy: /tmp/manuals/Prema_6047_6048_Manual.txt
#   PREMA DMM 6047/6048 Instruction Manual (PREMA Praezisionselektronik GmbH,
#   part no. 6048E-9143). Line numbers below refer to the local OCR copy.
# ==========================================================================

[dmm]
name   = PREMA DMM 6048
model  = 6048
digits = 8.5

[identify]
# NO identification query exists on this instrument. A full-text search of
# the manual turns up no "*IDN?", "ID?" or any other identify command, and
# the error-message table (section 5.11, lines 3104-3157) lists no
# "unrecognized command" code at all - only "Error 6", defined at lines
# 3135-3137 as "The multimeter has received more than 31 characters in a
# device message." What an unrecognized short string like the driver's
# default "*IDN?" would actually do is therefore genuinely undocumented, so
# 'query' is deliberately pinned to "MR" - a real, harmless, documented
# command ("MR": "The measurement result is selected. It appears in the
# display... and in the character string of the TALKER function", lines
# 4332-4334 / 4572) - rather than left blank, because a blank value falls
# back to the driver's own "*IDN?" default (dmm_driver.py DMMConfig.get()),
# which is exactly the untested command this note is warning against.
# MR's response is an ordinary reading string, not an identity, so 'match'
# is left blank and this config cannot be auto-paired by a bus scan -
# select it manually, as for any coded-range instrument.
query = MR
match =

[connection]
interface = GPIB
resource  =
# Factory default address, quoted verbatim at line 1915:
#   "The basic device address is set to IEEE.07.8 at the factory,
#    i.e.address 7, terminator 8 (EOI)."
# Address and terminator can ONLY be set from the front-panel keyboard, not
# by any bus command - lines 4136-4139:
#   "The only exceptions are the setting of the device address and
#    terminating character sequence, which can be set only from the
#    keyboard."
# Procedure (section 8.1.4, lines 4271-4295): press "2nd" then "IEEE" to
# show "IEEE.aa.t"; enter the two address digits, CURSOR to the terminator
# digit, enter it, then ENTER. Address is selectable 0-30 (line 4230).
address   = 7
gpib_template = GPIB0::{addr}::INSTR
lan_template  = TCPIP0::{addr}::inst0::INSTR
usb_template  = {addr}
# Terminator designations, the full table at lines 4248-4269:
#   0 CR+EOI   1 CR   2 LF+EOI   3 LF   4 CR+LF+EOI
#   5 CR+LF (HP-typical, no EOI)   6 LF+CR+EOI   7 LF+CR   8 EOI only (Commodore)
# The factory default is designation 8 - EOI line only, with NO CR or LF
# byte at all in the message. This ini format cannot express a genuinely
# blank termination string (a blank key falls back to "\n" - see
# dmm_driver.DMMConfig.get()), so "\n" is set below purely to satisfy the
# schema. It is expected to be functionally inert with the factory
# terminator: on GPIB, EOI asserted with the instrument's last output byte
# ends a read regardless of whether a termination character also matches,
# so a live unit left at its factory "IEEE.07.8" setting should read
# correctly with no front-panel change needed.
# UNVERIFIED: the manual frames this whole terminator table as being about
# what "your computer" needs to recognise the END of a message FROM the
# DMM (lines 4237-4241 - "This character sequence generally differs from
# one computer to another... consult the manual for your computer... to
# determine the particular terminator sequence used by your computer"), and
# never states whether a trailing CR/LF sent BY the computer on a WRITTEN
# command is tolerated, ignored, or miscounted against the 30/31-character
# message limit (lines 4153, 3136-3137 disagree with each other on the
# exact figure: 30 vs "more than 31"). Confirm against a live unit; if
# short commands like "VD" or "T9" are rejected, try write_termination =
# (blank, which still falls back to "\n") or reduce setup_dwell_s to isolate
# which line is the problem.
read_termination  = \n
write_termination = \n
# T9 (see [dcv]) integrates for 20 sec; 30 sec gives comfortable headroom
# for the blocking trigger-query described in [dcv] plus normal GPIB
# overhead, without being so long that a genuine non-response hangs the tool.
timeout_ms  = 30000
# UNVERIFIED (inferred, not an explicit quote): the capability list at line
# 4187 includes "RL1" (Remote control), and lines 4143-4151 describe REN
# going inactive as what returns the instrument to local control ("...manual
# control from the keyboard is possible again only when the computer
# enables the keyboard (command GTL) or when the REN line goes to the
# inactive state..."), which implies REN is the mechanism that puts the
# instrument into remote in the first place, consistent with every other
# RL1-capable pre-SCPI instrument in this folder (3458A, 8508A, 1281,
# R6581). Asserting it is the safer default even if this particular
# instrument turns out to accept commands with REN unasserted.
assert_ren  = true
# No connect-time ASCII initialisation is sent. There is no *CLS/*RST
# equivalent in this command set; the nearest thing, "DCL"/"SDC" (Device
# Clear / Selected Device Clear - lines 4197-4206: "The command DCL sets
# the instrument to its basic state (Vdc, 1000V)... DCL Device Clear
# Vdc,1000V, scanner off, long string"), is a low-level GPIB bus message,
# not a text command - dmm_driver.DMM.connect() already sends the
# equivalent via PyVISA's inst.clear() on every connect, independently of
# this file. Each [*] setup block below re-selects its own function, range
# mode and integration time explicitly, so nothing further is needed here.
init =

[dcv]
# VD: "Direct voltage" - clean listing at line 4572, matching the garbled
# precursor at line 4374-4375 ("Sets the digital multimeter to the 'direct
# voltage' measuring function").
#
# RANGE: always autoranged - see the file-level LIMITATION note above.
# A1 / A0 (autorange on/off): lines 4619-4620 and 4453-4454.
# {range} is intentionally NOT referenced. Manually confirmed the five DCV
# ranges support genuine remote fixed-range selection too (line 961:
# "RANGE SELECTION ... manual, automatic or by remote control", and the Rx
# table at lines 4605-4613: R1=0.2V, R2=2V, R3=20V, R4=200V, R5=1000V,
# corroborated again at lines 5015-5030) - a future maintainer who wants
# fixed ranges could hard-code a single Rx literal per copy of this file
# (one .ini per range), but that is not attempted here.
#
# INTEGRATION / DIGITS: no NPLC concept. "Tx" sets a fixed integration time
# AND the displayed/transmitted digit count together (lines 4462-4463: "Sets
# the integration time and the number of digits shown in the display"). The
# full table (lines 4622-4638, confirmed again independently at lines
# 5035-5063) runs T0=20ms/4.5-digit up to TB=80s, with a model-specific
# override for the top three codes:
#   "Caution in DMM 6048 / x=9 Integration time 20sec  8 1/2 digits /
#    x=A  40sec  8 1/2 digits / x=B  80sec  8 1/2 digits" (lines 4635-4638,
#    and independently at lines 5060-5063 with the same three values -
#    this second listing is what resolves an OCR misread of "9 1/2 digits"
#    for TB in the first listing to the correct "8 1/2 digits").
# T9 (20 sec, full 8.5-digit resolution) is hard-coded as a reference-grade
# default: slow enough for rated accuracy, an order of magnitude faster
# than the TB ceiling. {nplc} is not referenced. Edit the "T9" line below to
# T8 (10 sec)/TA (40 sec)/TB (80 sec) to trade speed for a little more or
# less settling if needed; on the 7.5-digit 6047 the same codes give 7.5
# digits (no "Caution" override applies there).
#
# MR: re-asserts measurement-result (not calculation-result/constant/
# program) output on the TALKER string every time setup runs - see
# [identify] above for the citation.
setup =
    VD
    A1
    T9
    MR
setup_auto =
    VD
    A1
    T9
    MR
setup_dwell_s     = 0.3
drain_after_setup = false
trigger  = S1
query    =
settle_s = 1.0
drain_before_read = false
# The full 1000 V range is genuinely supported - no max_input ceiling.
# Ranges, line 958-959: "RANGES +/-0,2V; +/-2V; +/-20V; +/-200V; +/-1000V".
# Continuous overload rating on the 1000 V range matches its own top value,
# lines 1102-1104: "+/-200V, +/-1000V range, continuous .... +/-1000V", so
# the R6161's 1000 V point applies no overvoltage margin loss. The 1000 V
# range is also the power-up default (line 1904: "the unit automatically
# switches to the 1000V direct voltage measuring range").
max_input =

# No [dci] section is omitted - DC current IS present on this instrument.
# See [dci] below.

[dci]
# ID: "Direct current" - clean listing at line 4588, matching the garbled
# precursor at line 4428 ("Selects the 'direct current' measuring
# function") and the front-panel keystroke table at line 3706 ("Direct
# current measurement 2nd mAdc").
#
# ONLY ONE RANGE EXISTS: line 1386, "RANGE .......... +/- 2A" - no R1..R7
# sub-ranges are listed under DCI anywhere in the manual (the Rx table's R5
# row lists "mAdc, mAac" merely as the one code current shares with the
# 1000 V/2 MOhm row, lines 4613 and 5030). No autorange command is sent for
# this reason - there is nothing to range over.
#
# Current is markedly lower resolution than volts on this instrument: line
# 1388, "MAX. DISPLAY SPAN ......... 1 999,999" (~7 digits, unlike DCV/OHMF
# which reach 199,999,999 on T9-TB). T9 is still used here for a long,
# quiet integration - it costs nothing extra since there is only one range
# to settle on - but do not expect 8.5-digit current readings.
#
# MR: see [dcv].
setup =
    ID
    T9
    MR
setup_dwell_s     = 0.3
drain_after_setup = false
trigger  = S1
query    =
settle_s = 1.0
drain_before_read = false

[ohmf]
# 4-wire ohms measures the standard resistors, so it wants accuracy over speed:
# offset compensation, a settling delay, and a long integration. Offset
# compensation matters most -- it reads twice, with and without the test
# current, and subtracts, removing the thermal EMF that otherwise dominates a
# 10 ohm measurement.
#
# UNVERIFIED: the offset-compensation command for this meter could not be
# sourced from its programming manual, so it is NOT set here rather than
# guessed -- a setup line the meter rejects would be silently swallowed. If your
# manual gives one, add it to the setup block below. What is set is the longest
# integration the meter accepts (T9), plus a 1 s settle, which is safe and
# helps regardless.
#
# O4: "Resistance measurement, 4-wire circuit (Ohm 4-wire)" - clean listing
# at line 4580, matching the garbled precursor at lines 4419-4420 ("Selects
# the resistance measuring function in 4-wire circuit") and the front-panel
# keystroke table at line 3702 ("Resistance measurement (four-wire circuit)
# 2nd kOhm/4"). See the file-level note on the "O" vs "0" OCR ambiguity.
#
# measure_resistance_4w() (dmm_driver.py) always calls
# measure("ohmf", dmm_range="AUTO", ...), so the {range}-vs-Rx-code mismatch
# described at the top of this file does not bite in practice for this
# section - every real call already asks for AUTO. A1/T9/MR as in [dcv].
# The 6048-only LOW-current 4-wire mode ("L4", lines 4425-4426, 4585-4586)
# is not used - the R6161 tool has no use for it and it changes the
# measuring current, which would need its own accuracy figures.
setup =
    O4
    A1
    T9
    MR
setup_auto =
    O4
    A1
    T9
    MR
setup_dwell_s     = 0.3
drain_after_setup = false
trigger  = S1
query    =
settle_s = 1.0
drain_before_read = false
