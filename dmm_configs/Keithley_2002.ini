# ==========================================================================
# DMM configuration - Keithley 2002  (SCPI)
#
# 8.5 digit. The 2002 is the high-resolution member of the 2001 family and
# shares its command tree; only the display resolution and the accuracy
# specification differ.
#
# CONFIDENCE: medium-high. The command tree, :FORMat:ELEMents and the
# :READ? / :INITiate model are taken from Keithley's own Model 2001 Quick
# Reference SCPI Guide. The NPLC ceiling of 10 and the :DIGits range are from
# the instrument's documented specification rather than a quoted manual page;
# both lines are marked below. If a setting is refused, check the Operator's
# Manual section on the SENSe subsystem.
#
# Sources:
#   http://ridl.cfd.rit.edu/products/manuals/Keithley/pdfs/app_notes/4073-1,0.pdf
#   https://www.tek.com/en/products/keithley/digital-multimeter/2001-series
# ==========================================================================

[dmm]
name   = Keithley 2002
model  = 2002
digits = 8.5

[identify]
query = *IDN?
match = MODEL 2002

[connection]
interface = GPIB
resource  =
address   = 16
gpib_template = GPIB0::{addr}::INSTR
lan_template  = TCPIP0::{addr}::inst0::INSTR
usb_template  = {addr}
read_termination  = \n
write_termination = \n
timeout_ms  = 60000
assert_ren  = false
# :FORM:ELEM READ strips the units, timestamp and channel fields the 2001
# appends by default, leaving a bare number. The tool's parser would cope with
# the extra fields, but a bare reading removes any chance of it selecting the
# wrong one.
init =
    *CLS
    :FORM:ELEM READ
    :INIT:CONT OFF

[dcv]
# The Keithley dialect names the function as a quoted string and sets the range
# in a separate command; the range parameter does not accept the word AUTO, so
# autoranging has its own block.
setup =
    :SENS:FUNC 'VOLT:DC'
    :SENS:VOLT:DC:RANG:AUTO OFF
    :SENS:VOLT:DC:RANG {range}
    :SENS:VOLT:DC:NPLC {nplc}
setup_auto =
    :SENS:FUNC 'VOLT:DC'
    :SENS:VOLT:DC:RANG:AUTO ON
    :SENS:VOLT:DC:NPLC {nplc}
setup_dwell_s     = 0.4
drain_after_setup = false
# UNVERIFIED against a manual page: the 2001 integrates up to 10 power-line
# cycles, not the 100 that Keysight meters allow. Declaring the ceiling here
# means a request for 100 is reduced to 10 rather than being refused, which
# on this instrument would otherwise leave the previous integration in force.
nplc_max = 10
nplc = 10
trigger  =
query    = :READ?
settle_s = 0.5
drain_before_read = false

[dci]
setup =
    :SENS:FUNC 'CURR:DC'
    :SENS:CURR:DC:RANG:AUTO OFF
    :SENS:CURR:DC:RANG {range}
    :SENS:CURR:DC:NPLC {nplc}
setup_auto =
    :SENS:FUNC 'CURR:DC'
    :SENS:CURR:DC:RANG:AUTO ON
    :SENS:CURR:DC:NPLC {nplc}
setup_dwell_s     = 0.4
drain_after_setup = false
nplc_max = 10
nplc = 10
trigger  =
query    = :READ?
settle_s = 0.5
drain_before_read = false

[ohmf]
# 4-wire ohms is used to measure the standard resistors, so it is set up for
# accuracy rather than speed: offset compensation on, a settling delay before
# the integration, and a long integration. Offset compensation is the important
# one -- it reads twice, with and without the test current, and subtracts, which
# removes the thermal EMF that otherwise dominates a 10 ohm measurement.
setup =
    :SENS:FUNC 'FRES'
    :SENS:FRES:RANG:AUTO OFF
    :SENS:FRES:RANG {range}
    :SENS:FRES:NPLC {nplc}
    :SENS:FRES:OCOM ON
    :TRIG:DEL 1
setup_auto =
    :SENS:FUNC 'FRES'
    :SENS:FRES:RANG:AUTO ON
    :SENS:FRES:NPLC {nplc}
    :SENS:FRES:OCOM ON
    :TRIG:DEL 1
setup_dwell_s     = 0.4
drain_after_setup = false
nplc_max = 10
nplc = 10
trigger  =
query    = :READ?
settle_s = 0.5
drain_before_read = false
