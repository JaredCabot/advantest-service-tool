# ==========================================================================
# DMM configuration - Fluke 8558A 8 1/2 Digit Multimeter  (SCPI)
#
# 8.5 digit. The 8588A's sibling: the same "Product" remote command set,
# packaged as a somewhat lower-cost calibration multimeter.
#
# CONFIDENCE: high for the command set, which is documented as identical to
# the 8588A's. Every command below is quoted from the SAME manual as
# Fluke_8588A.ini - the 8588A/8558A Remote Programmer's Manual, March 2019
# Rev. 1, 2/25 (local copy at
# /tmp/manuals/Fluke_8588A_8558A_Remote_Programmers_Manual.txt) - which
# covers both models under the umbrella term "the Product" throughout (title
# page, line 119: "This document defines the remote interface commands for
# the Fluke Calibration 8588A Reference Multimeter and 8558A 8 1/2 Digit
# Multimeter (the Product, DMM, or Instrument)."). No command, range, or
# NPLC/aperture limit anywhere in the manual is written as applying to one
# model but not the other; see Fluke_8588A.ini's header for the full
# rationale (trigger model, NPLC vs APERture, offset compensation) - it is
# not repeated here since it is identical.
#
# Digit count: the manual's own running title names the 8558A "8 1/2 Digit
# Multimeter" (e.g. line 119, line 2 of every page footer/header), hence
# digits = 8.5 below, matching the 8588A.
#
# UNVERIFIED - accuracy specification: a Remote Programmer's Manual does not
# carry accuracy tables, so whatever separates the 8558A from the 8588A in
# real measurement performance is not covered by this document (nor by
# this config, which the R6161 tool does not use for tolerance math). If
# that distinction matters, check the 8558A Specifications / Users Manual.
# UNVERIFIED - default GPIB address: not stated for either model; see the
# [connection] comment below, same caveat as the 8588A.
#
# Sources:
#   Fluke 8588A/8558A Reference Multimeter and 8 1/2 Digit Multimeter Remote
#   Programmer's Manual, March 2019 Rev. 1, 2/25 (c) Fluke Corporation.
#   https://www.fluke.com/en-us/product/calibration-tools/electrical-calibration/bench-multimeters/8558a
# ==========================================================================

[dmm]
name   = Fluke 8558A 8.5 Digit Multimeter
model  = 8558A
digits = 8.5

[identify]
query = *IDN?
match = 8558A

[connection]
# GPIB, USBTMC-USB488 and Ethernet are all documented remote interfaces
# (manual p.1: "The Product supports remote control GPIB, USBTMC-USB488, and
# Ethernet."). Only one port is active at a time - it is selected from the
# front-panel Remote Settings menu, or remotely with
# SYSTem:COMMunicate:ENABLE USB|GPIB|ENET (line 3061-3062).
interface = GPIB
resource  =
# UNVERIFIED: as with the 8588A, the manual documents GPIB addresses as
# user-assigned 1-30 (p.5) but gives no factory-default value. Read it from
# Q > Remote Settings > GPIB Address on the meter, or prefer LAN/USB.
address   = 22
gpib_template = GPIB0::{addr}::INSTR
lan_template  = TCPIP0::{addr}::inst0::INSTR
usb_template  = {addr}
# Ethernet EOL defaults to LF (p.8); \n matches that default.
read_termination  = \n
write_termination = \n
timeout_ms  = 120000
assert_ren  = false
# Manual's documented connect sequence for GPIB/USBTMC/Ethernet alike
# (pp.6-8): "Clear registers and read the status byte: Write: *CLS;*RST".
init =
    *CLS
    *RST

[dcv]
# CONFigure:VOLTage:DC [<range>|MIN|MAX|DEF[,<resolution>|MIN|MAX|DEF]]
# (p.13, line 723); autorange is a separate :RANGe:AUTO[:STATe] <boolean>
# (p.35, line 2172), so it gets its own setup_auto block below.
# DCV range per Table 7 (p.42): "Range: 1000 (Min 0.1, Max 1000)" - the full
# 1000 V the R6161 can put out, so no max_input is declared.
setup =
    CONF:VOLT:DC {range}
    SENS:VOLT:DC:NPLC {nplc}
setup_auto =
    CONF:VOLT:DC
    SENS:VOLT:DC:RANG:AUTO ON
    SENS:VOLT:DC:NPLC {nplc}
setup_dwell_s     = 0.5
drain_after_setup = false
# Table 7 (p.42): DCV "NPLC Min = 0 Max = 600" - a continuous range.
nplc_max = 600
nplc = 10
trigger  =
# READ? "is the same as sending the TRIGger commands: ABORt;
# INITiate:IMMediate;FETCh?" (p.17, Table 5).
query    = READ?
settle_s = 0.5
drain_before_read = false

[dci]
# CONFigure:CURRent:DC [<range>|MIN|MAX|DEF[,<resolution>|MIN|MAX|DEF]]
# (p.13, line 715). Table 7 (p.42) gives the DCI default range as 30 (A).
setup =
    CONF:CURR:DC {range}
    SENS:CURR:DC:NPLC {nplc}
setup_auto =
    CONF:CURR:DC
    SENS:CURR:DC:RANG:AUTO ON
    SENS:CURR:DC:NPLC {nplc}
setup_dwell_s     = 0.5
drain_after_setup = false
# Table 7 (p.42): DCI "NPLC Min = 0 Max = 600", same continuous range as DCV.
nplc_max = 600
nplc = 10
trigger  =
query    = READ?
settle_s = 0.5
drain_before_read = false

[ohmf]
# 4-wire ohms measures the standard resistors, so it wants accuracy over speed:
# offset compensation, a settling delay, and a long integration. Offset
# compensation matters most -- it reads twice, with and without the test
# current, and subtracts, removing the thermal EMF that otherwise dominates a
# 10 ohm measurement.
#
# UNVERIFIED: the offset-compensation command for this meter could not be
# sourced from its programming manual, so it is NOT set here rather than
# guessed -- a setup line the meter rejects would be silently swallowed. If your
# manual gives one, add it to the setup block below. What is set is the longest
# integration the meter accepts, which is safe and helps regardless.
# CONFigure:FRESistance [<range>|MIN|MAX|DEF[,<resolution>|MIN|MAX|DEF]]
# (p.13, line 727); FRES is the documented short form (p.16, line 799).
# [:SENSe]:FRESistance:MODE NORMal|TRUE|HIV (p.28, line 1617) sets the
# 4-wire Ohms mode; NORMal is used explicitly - no OCOM-equivalent command
# exists in this manual, and TRUE mode's behaviour is undocumented, so it is
# not used (same reasoning as Fluke_8588A.ini).
setup =
    CONF:FRES {range}
    SENS:FRES:NPLC {nplc}
    SENS:FRES:MODE NORM
setup_auto =
    CONF:FRES
    SENS:FRES:RANG:AUTO ON
    SENS:FRES:NPLC {nplc}
    SENS:FRES:MODE NORM
setup_dwell_s     = 0.5
drain_after_setup = false
# Table 7 (p.42-43): "Resistance 4W Normal ... NPLC Min = 0 Max = 600".
nplc_max = 600
nplc = 200
trigger  =
query    = READ?
settle_s = 0.5
drain_before_read = false
