# ==========================================================================
# DMM configuration - Fluke 8508A Reference Multimeter
#
# 8.5 digit. NOT a SCPI instrument: it has its own pre-SCPI-flavoured
# command language (though it does implement the IEEE 488.2 common commands
# *IDN?, *CLS, *RST, *TRG, *ESE, *STB? etc. alongside its native verbs).
#
# COMMAND LANGUAGE NOTES, both encoded below:
#   * Range and every modifier (filter, resolution, speed, wire mode) are
#     sent as ONE comma-separated program message after the function
#     mnemonic, e.g. "DCV 1000,FILT_OFF,RESL7,FAST_ON,TWO_WR" -- this is the
#     literal form the manual itself uses to describe each function's
#     Power-On and Reset Conditions (Ch.4, "Syntax Diagrams of Major 8508A
#     Functions"), so it is used verbatim as the setup command here rather
#     than as separate SCPI-style lines.
#   * There is no NPLC concept. Integration time is fixed by a resolution
#     token (RESL5..RESL8 = 5.5..8.5 digits) crossed with FAST_ON/FAST_OFF
#     (Ch.4 and Table 3-2, ADC integration times). {nplc} is therefore never
#     used in this file; RESL7,FAST_ON is used throughout because it is
#     also the instrument's own power-on default for DCV, DCI and OHMS
#     (Ch.2, "Power-On Configuration" and the per-function "Power On and
#     Reset Conditions" notes in Ch.4), so it is a setting the instrument
#     is known to accept on every function used here.
#   * 4-wire resistance is measured with TRUE_OHMS rather than plain
#     OHMS...,FOUR_WR: True Ohms takes two readings with the stimulus
#     current reversed and combines them to cancel thermal EMFs, which is
#     the same reason the Keysight 34420A config below enables OCOM. It is
#     restricted to 2 ohm..20 kohm (4-wire only, no wire-mode token exists
#     for it), which comfortably covers a ~10 ohm current-limit standard.
#     For a 4-wire resistance outside that span, use plain
#     "OHMS {range},FILT_OFF,RESL7,FAST_ON,FOUR_WR,LOI_OFF" instead (Normal
#     OHMS covers 1 ohm..20 Mohm; Hi-V Ohms covers 20 Mohm..20 Gohm) -- not
#     wired up as a separate section here since it is not needed for the
#     R6161's current-limit resistor.
#
# CONFIDENCE: medium. The command syntax, range tokens, resolution/speed
# tokens, wire-mode tokens, trigger model and terminator are taken directly
# from the manual and are high confidence. Two things are NOT stated in the
# manual and are marked UNVERIFIED below: the factory-default GPIB address,
# and whether REN must be asserted before the parser accepts commands (the
# manual documents REN/remote behaviour only in general IEEE-488.1 terms).
#
# Sources:
#   Fluke 8508A Reference Multimeter Users Manual, Chapter 4 "Remote
#   Operations Using the IEEE 488 Interface" (command syntax diagrams,
#   status/trigger model, terminator, *IDN?/*CLS); Chapter 3 "Making
#   Measurements" (True Ohms description, Table 3-2 integration times);
#   Chapter 2 "Power-On Configuration"; Chapter 5 "Electrical Measurement
#   Specifications" (DCV/DCI ranges and protection limits).
# ==========================================================================

[dmm]
name   = Fluke 8508A Reference Multimeter
model  = 8508A
digits = 8.5

[identify]
# *IDN? IS implemented despite the native command set otherwise predating
# SCPI ("Instrument I/D and Setup", Ch.4): "Recalls the instrument's
# manufacturer, model number, serial number and firmware level."
query = *IDN?
match = 8508A

[connection]
interface = GPIB
resource  =
# UNVERIFIED - the manual states only that "The Multimeter address can only
# be set manually; using the ADDRESS menu that is accessed via the Utility
# menu" (Ch.4, "Setting the Multimeter Address") and that valid addresses
# are 0-30; no factory-default address is given anywhere in this manual.
# Read the actual address from UTILITY > Bus Addr on the front panel and
# put it here.
address   = 4
gpib_template = GPIB0::{addr}::INSTR
lan_template  = TCPIP0::{addr}::inst0::INSTR
usb_template  = {addr}
# "The message terminator for the 8508A Reference Multimeter is the
# hexadecimal number 0A, characterized in IEEE 488.2 as NL. Alternatively,
# the EOI (end or identify) line can be set true with the last byte to be
# sent." (Ch.4, "The Program Message Terminator") -- plain LF, no CR.
read_termination  = \n
write_termination = \n
# RESL8,FAST_OFF integration is documented at up to 16 x 64 PLC (Table
# 3-2), i.e. over a second at 60 Hz and worse at 50 Hz; RESL7,FAST_ON (used
# below) is far faster, but the timeout is left generous in case an
# operator edits the setup blocks to a slower resolution.
timeout_ms  = 60000
# UNVERIFIED - the manual documents IEEE-488.1 capability code RL1
# ("Remote/Local Capability including Local Lockout") and states that under
# controller direction "the right hand display indicates Remote Operation
# ... front panel controls are disabled" (Ch.4, "Remote Operation General
# Considerations"), which is standard REN-gated behaviour, but it does not
# say in so many words that commands are rejected without REN asserted (as
# the 3457A/3458A manuals do say for those meters). REN is asserted here as
# the safe default for an instrument of this vintage; verify against your
# unit if it appears to ignore commands with assert_ren = false.
assert_ren  = true
# *CLS clears the event registers and queues without touching the function,
# range or calibration state (Ch.4, "Clear Status" and "*RST does not
# affect ... The selected address of the instrument [or] Calibration data",
# under "Reset"). *RST is deliberately not sent for the same reason it
# isn't sent for the 34420A: it would drop the operator's front-panel setup.
# TRG_SRCE EXT is sent once here (it is a general triggering command, not
# scoped to a measurement function) so that "Controller-generated GET or
# *TRG commands" become the trigger source instead of the meter's own free-
# running "internal interval counter" (Ch.4, "Trigger Source Selector") --
# without this, X? below reads back whatever the internal timer produced
# rather than a reading taken to order.
init =
    *CLS
    TRG_SRCE EXT

[dcv]
# Comma-separated program message, following the exact form the manual uses
# for this function's own Power On and Reset Conditions example
# ("1kV, FILT_OFF, RESL7, FAST_ON, TWO_WR", Ch.4, "DC Voltage"). Nrf (here
# {range}) "selects the range for the expected signal ... Any valid
# numeric value cancels autorange"; AUTO is a separate literal token, not a
# value Nrf accepts, hence the separate setup_auto block below.
setup =
    DCV {range},FILT_OFF,RESL7,FAST_ON,TWO_WR
setup_auto =
    DCV AUTO,FILT_OFF,RESL7,FAST_ON,TWO_WR
setup_dwell_s     = 0.4
drain_after_setup = false
# No NPLC concept on this meter -- see the file header. RESL7,FAST_ON (7.5
# digits, 64 PLC) is baked into setup/setup_auto above instead.
# DCV ranges are decade 200 mV, 2 V, 20 V, 200 V and 1000 V, full-scale
# 1050.00000 V on the top range, with "Protection (All ranges) ... 1 kV
# rms" (Ch.5, "DC Voltage" specification table). The 1000 V range is a
# real, selectable range, so the R6161's 1000 V output CAN be applied here.
max_input = 1000
# X? "Equivalent to performing an Execute Trigger (*TRG;RDG?) followed by a
# reading query. X? is intended for high speed use." (Ch.4, "Execute
# Trigger and Take a Reading"). RDG? on its own "will wait for the
# completion of the measurement before placing the result in the output
# queue" (Ch.4, "Reading Recall"), so the query blocks until data is ready
# and no extra settle time is required beyond the setup dwell.
trigger  =
query    = X?
settle_s = 0.2
drain_before_read = false

[dci]
setup =
    DCI {range},FILT_OFF,RESL7,FAST_ON
setup_auto =
    DCI AUTO,FILT_OFF,RESL7,FAST_ON
setup_dwell_s     = 0.4
drain_after_setup = false
# DCI tops out at RESL7 (7.5 digits) -- there is no RESL8 token for this
# function (Ch.4, "DC Current"). Ranges are decade 200 uA .. 20 A; front-
# input protection is 20 A rms (Ch.5, "DC Current" specification table).
max_input = 20
trigger  =
query    = X?
settle_s = 0.2
drain_before_read = false

[ohmf]
# 4-wire ohms measures the standard resistors, so it wants accuracy over speed.
# TRUE_OHMS is already this meter's offset-compensated mode -- it reads with and
# without the test current and subtracts, removing the thermal EMF that
# otherwise dominates a 10 ohm measurement -- so no separate command is needed.
# FAST_OFF selects the longer integration, which a resistance measured once at
# the start of a run can well afford.
# True Ohms: "takes two measurements per reading. The second measurement is
# made with the current reversed relative to the first measurement. The
# two measurements are combined to eliminate the effects of any external
# EMFs that may be present. This function provides only 4-wire
# measurements of resistance, in decade ranges from 2 Ohm to 20 kOhm."
# (Ch.3, "True Ohms"). No TWO_WR/FOUR_WR token exists for this function --
# it is unconditionally 4-wire.
setup =
    TRUE_OHMS {range},RESL8,FAST_OFF,LOI_OFF
setup_auto =
    TRUE_OHMS AUTO,RESL8,FAST_OFF,LOI_OFF
setup_dwell_s     = 0.4
drain_after_setup = false
# Decade ranges only go to 20 kohm (see header note for the plain
# OHMS...,FOUR_WR fallback above that range).
max_input = 20000
trigger  =
query    = X?
settle_s = 0.2
drain_before_read = false
