# ==========================================================================
# Measurement uncertainty budget for the Advantest R6161 tool.
#
# OPTIONAL. Leave every figure blank and nothing changes: the certificate's
# uncertainty column reads "-" and the certificate states plainly that no
# budget is reported. Fill it in and the certificate quotes an expanded
# uncertainty for every point, and rounds each measured value and deviation to
# the resolution that uncertainty justifies (GUM JCGM 100:2008 section 7.2.6).
#
# The tool cannot evaluate this for you. It knows what it measured; it does not
# know your 3458A's accuracy at that reading, that meter's own calibration
# uncertainty, your standard resistors' tolerances, or the thermal EMF of your
# interconnects. Those are yours to evaluate, and they are what goes here.
#
# ---------------------------------------------------------------------------
# TWO WAYS TO WRITE A FIGURE
#
# Every function section reads the same three keys:
#
#   ppm_reading   ppm of the reading
#   ppm_range     ppm of the range's full scale
#   floor_uv      an absolute floor, in microvolts  (current: floor_na, in nA)
#
# and one flag that says what they are:
#
#   expanded = no    (default) they are STANDARD uncertainties, k = 1. They are
#                    combined and then multiplied by the coverage factor k.
#   expanded = yes   they are ALREADY EXPANDED at that k, as a calibration
#                    certificate usually quotes them ("+/- 3 ppm of reading,
#                    k = 2"). They are combined and used as they stand.
#
# So a budget can be written in whichever form your paperwork uses. Copy the
# numbers across and set the flag to match; nothing else differs.
#
#   GET THIS FLAG RIGHT. A manufacturer's ACCURACY SPECIFICATION is a limit,
#   not a standard uncertainty: it already contains its own coverage. Entering
#   one with "expanded = no" multiplies it by k a second time, which doubles
#   every uncertainty on the certificate and, under guarded acceptance, halves
#   the band left to hold the instrument to. If your figure came from a data
#   sheet or a specification table, it belongs under "expanded = yes".
#
#   Only a figure explicitly quoted as a standard uncertainty, or one you
#   derived yourself from a distribution (a limit +/-a treated as rectangular
#   is a/sqrt(3), for instance), belongs under "expanded = no".
#
# ---------------------------------------------------------------------------
# HOW THE TERMS GO TOGETHER
#
#   combine = rss      (default) root sum of squares, which treats the three
#                      terms as independent contributions to one budget:
#                        u = sqrt( (ppm_reading x reading)^2
#                                  + (ppm_range x full scale)^2 + floor^2 )
#
#   combine = linear   arithmetic sum, which is how the two halves of a
#                      SPECIFICATION LIMIT are meant to be read -- "20 ppm of
#                      reading + 5 ppm of range" is one limit whose parts add,
#                      not two independent uncertainties:
#                        u = ppm_reading x reading + ppm_range x full scale
#                            + floor
#
# A figure copied from a data sheet almost always wants "linear", for the same
# reason it wants "expanded = yes". Combining a specification's own terms in
# quadrature understates it: for a 3458A's 100 mA range it gives 36 ppm where
# the specification says 41, and under guarded acceptance an understated
# uncertainty flatters the result.
#
# Set it in [general] for the whole budget, or in one section to override that.
#
# The observed spread joins in quadrature either way -- it is genuinely
# independent of the reference's specification:
#
#   U = k x sqrt( u^2 + spread^2 )
#
# ---------------------------------------------------------------------------
# WHERE TO GET THE NUMBERS
#
# For the reference multimeter, the dominant term is its accuracy specification
# for the interval since its last calibration, at the range in use -- most
# 8.5-digit meters state this as ppm of reading + ppm of range, which is why
# this file is written that way. That is a limit value, so it goes in with
# "expanded = yes".
#
# Note that a 3458A's ranges are 20 % over-range, so its ppm-of-range term is
# multiplied by 1.2 at that range's true full scale, not by 1. Table 6-6 of the
# Technical Reference works the current ranges through as an example.
#
# Add to it, in quadrature and in the same expanded form:
#   * the expanded uncertainty from the meter's OWN calibration certificate, at
#     the same k;
#   * anything the specification does not cover: temperature drift since its
#     calibration, and for the divider ranges the thermal EMF of the
#     interconnects, which belongs in floor_uv.
#
# Mixing forms within one section is not possible -- the flag is per section --
# so convert before you add. Chapter 6 of the Technical Reference has the
# worked figures for the current ranges, including what a guard band leaves.
#
# The values below are NOT a budget. They are placeholders, deliberately left
# blank so that an unedited file reports nothing rather than reporting numbers
# nobody evaluated.
# ==========================================================================

[general]
# Coverage factor. k = 2 is about 95 % for a normal distribution, and is what
# the certificate's uncertainty statement describes.
k = 2

# How the PASS/FAIL verdict treats the uncertainty.
#
#   simple    ILAC-G8 section 4.2.1 simple acceptance. The verdict stays
#             |deviation| <= specification, and the uncertainty is reported
#             beside it for the reader to weigh. Nothing that passes on the
#             specification alone starts failing.
#   guarded   |deviation| <= specification - U. A point too close to the limit
#             to resolve is reported as a failure. Stricter, and it bites
#             hardest where the reference is weakest: on 100 mA measured
#             directly a 3458A is only about 1.3:1 better than the R6161's own
#             specification, so U eats a real fraction of the band.
#
# Both are legitimate and the choice is the laboratory's, not the tool's.
# Whichever is set, the certificate states which rule it used.
decision_rule = simple

# How each section's own terms are combined: rss or linear. See the block above.
# Data-sheet figures want linear; a budget you built yourself from independent
# contributions wants rss. A section may override this.
combine = rss

# Fold in the spread between the two readings the tool already takes at every
# point, as a type-A contribution. It costs nothing, it is per-point, and it is
# the one term here the tool can measure for itself.
include_observed_spread = yes


# --------------------------------------------------------------------------- #
# Main voltage output: the 1 V, 10 V, 100 V and 1000 V ranges, measured
# straight across the output terminals.
# --------------------------------------------------------------------------- #
[dcv]
expanded    = no
ppm_reading =
ppm_range   =
floor_uv    =

# Per-range sections override the function's. Use them where one range is
# genuinely different -- 1000 V is usually the meter's worst, and its own
# calibration is often the least recently confirmed.
# [dcv.1000V]
# ppm_reading =
# ppm_range   =


# --------------------------------------------------------------------------- #
# Divider output: the 10 mV, 100 mV and 1000 mV ranges. Separate from [dcv]
# because it is a different measurement and often a different meter -- if a
# 34420A takes these ranges, its figures belong here and not above.
#
# floor_uv matters most here. At 10 mV full scale one microvolt is 100 ppm,
# which is larger than the quantity being measured, so the thermal EMF of the
# interconnects is not a rounding error but a leading term.
# --------------------------------------------------------------------------- #
[divider]
expanded    = no
ppm_reading =
ppm_range   =
floor_uv    =

# [divider.10mV]
# floor_uv    =


# --------------------------------------------------------------------------- #
# Current output measured DIRECTLY, through the meter's own current terminals.
# On a 3458A this is the weaker function; its specification is what goes here.
# --------------------------------------------------------------------------- #
[dci]
expanded    = no
ppm_reading =
ppm_range   =
floor_na    =


# --------------------------------------------------------------------------- #
# Current output measured as a VOLTAGE DROP across a standard resistor. These
# are the METER's DC voltage figures for the drop, which is about 1 V at full
# scale on every range -- not its current figures. The resistors' own
# tolerances go in [resistor] below and are combined with these.
#
# floor_uv is a voltage floor at the meter; the tool divides it by the
# resistance in use to reach a current.
# --------------------------------------------------------------------------- #
[shunt]
expanded    = no
ppm_reading =
ppm_range   =
floor_uv    =


# --------------------------------------------------------------------------- #
# The standard resistors, as ppm of their calibrated value, one per range. Only
# used for the ranges actually measured as a voltage drop.
#
# Include the power coefficient, not just the calibration uncertainty: a
# standard is characterised cold and used hot, and 100 mA through 10 ohm is
# 0.1 W. If the manufacturer quotes a power coefficient, the term is that
# coefficient times the dissipation at full scale.
# --------------------------------------------------------------------------- #
[resistor]
1mA   =
10mA  =
100mA =
